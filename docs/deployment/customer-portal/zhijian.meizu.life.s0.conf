# S0 customer portal on the current server. Cloudflare has a host-specific
# Full (strict) rule for zhijian.meizu.life; the zone default is unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name zhijian.meizu.life;

    access_log /var/log/nginx/zhijian.meizu.life-access.log;
    error_log  /var/log/nginx/zhijian.meizu.life-error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zhijian.meizu.life;

    ssl_certificate     /etc/ssl/zhijian.meizu.life/fullchain.pem;
    ssl_certificate_key /etc/ssl/zhijian.meizu.life/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/zhijian.meizu.life-access.log;
    error_log  /var/log/nginx/zhijian.meizu.life-error.log;
    client_max_body_size 1m;

    # Base64 JSON adds about one third to the 8 MiB attachment limit.
    location ~ "^/api/sessions/[0-9a-fA-F-]{36}/attachments$" {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:18460;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Base64 JSON expands a 16 MiB skill zip to about 22 MiB.
    location = /api/capabilities/skills-install {
        client_max_body_size 23m;
        proxy_pass http://127.0.0.1:18460;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18460;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
