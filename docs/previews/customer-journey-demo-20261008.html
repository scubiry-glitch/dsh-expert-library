<body>
  <section id="loginView" aria-label="客户登录演示">
    <div class="loginScene"><div class="brand"><span class="brandMark">见</span> 智见 · 专家协作室</div><div class="loginCopy"><span class="eyebrow">CUSTOMER RESEARCH SPACE</span><h1>从一个问题，<br>走向可信的报告。</h1><p>与智见讨论研究方向，调用有权限的数据源与专家，让每一步取证、确认和交付都留在自己的空间。</p></div><div class="journeyLine"><span>01 对话</span><span>02 查数</span><span>03 研究</span><span>04 报告</span></div></div>
    <div class="loginFormSide"><div class="loginBox"><span class="eyebrow">欢迎回来</span><h2>进入我的研究空间</h2><p>选择已开通的登录方式。首次进入后即可查看自己的会话，或从一个空白会话开始。</p><div class="idpStack"><button class="idpBtn" data-login="智号"><span class="idpIcon">智</span><span>使用智号继续</span><span>↗</span></button><button class="idpBtn" data-login="开发者中心"><span class="idpIcon">D</span><span>使用开发者中心继续</span><span>↗</span></button><button class="idpBtn" data-login="第三方账号"><span class="idpIcon">＋</span><span>其他已接入账号</span><span>↗</span></button></div><div class="loginFoot">交互演示：点击任一方式进入模拟账号。此页面不连接身份系统，也不读取真实会话。</div></div></div>
  </section>
  <div id="appView" hidden>
    <aside id="side" class="side"><div class="sideTop"><div class="brand"><span class="brandMark">见</span> 智见 · 我的研究</div><button id="accountBtn" class="sideAccount" title="演示账号"><span class="avatar">研</span><span><strong>示例客户账号</strong><small>客户工作区 · 个人空间</small></span><span class="caret">⌄</span></button></div><nav class="sideNav" aria-label="主导航"><div class="sideGroup">我的空间</div><button id="homeNav" class="sideLink active"><b>▤</b><span>全部会话</span><em id="navCount">2</em></button><button id="dataNav" class="sideLink"><b>▦</b><span>研究数据</span></button><button id="reportsNav" class="sideLink"><b>▣</b><span>报告成果</span></button><div class="sideGroup" style="margin-top:24px">最近的会话</div><div id="sideSessions"></div></nav><button id="newSide" class="newSide">＋ 新建会话</button><div class="sideBottom"><button id="usageNav" class="sideLink"><b>◷</b><span>我的用量</span></button><button id="logout" class="sideLink"><b>↩</b><span>退出演示账号</span></button></div></aside>
    <button id="scrim" class="scrim hidden" aria-label="关闭菜单"></button>
    <main class="main"><header class="topbar"><button id="menuBtn" class="iconBtn mobileMenu" aria-label="打开导航菜单">☰</button><span id="breadcrumb" class="crumb">我的研究 <strong> / 全部会话</strong></span><span class="spacer"></span><span class="topUsage">本账号用量 · <strong id="topUsageValue" class="mono">演示值</strong></span><button class="headAvatar" id="profileBtn" title="演示账号">研</button></header><div id="mainBody" class="mainBody"></div></main>
  </div>
  <span class="demoBadge">可点击 Demo · 示例数据</span>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal"><div class="dialogHead"><h2 id="modalTitle"></h2><button id="modalClose" class="iconBtn" aria-label="关闭">×</button></div><div id="modalBody" class="dialogBody"></div><div id="modalFoot" class="dialogFoot"></div></dialog>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const sampleRows = [['样例区域 A','住宅租赁','季度','示例口径 A','120'],['样例区域 B','住宅租赁','季度','示例口径 A','108'],['样例区域 C','住宅租赁','季度','示例口径 A','96']];
    const sampleResult = () => ({id:'sample-result',title:'样例区域租赁指标查询',source:'智见 · 演示数据源',queried:'本次演示',rows:sampleRows,selected:false});
    const sessions=[{id:'seed1',title:'城市租赁市场观察',status:'准备中',updated:'今天',tokens:'2,460',messages:[{who:'assistant',text:'你好，我是智见小秘书。你可以先告诉我想研究什么，也可以使用 @ 选择数据源、领域包或专家。'},{who:'user',text:'先看样例区域的租赁指标，再讨论报告方向。'},{who:'assistant',text:'我已经整理了一个演示查询结果。下一步建议明确研究范围与交付目标。'}],results:[sampleResult()],asked:false,report:'none',template:'市场观察报告'},{id:'seed2',title:'零售服务研究方案',status:'报告已交付',updated:'昨天',tokens:'8,120',messages:[{who:'assistant',text:'本次示例研究的报告已完成，可到工作区查看报告版本。'}],results:[],asked:true,report:'ready',template:'综合研究报告'}];
    let view='login', activeId=null, tab='conversation', selectedResult=null, mentionOpen=false, askOpen=false, toastTimer, reportTimer, mobileOpen=false;
    const $=s=>document.querySelector(s), body=$('#mainBody');
    const current=()=>sessions.find(s=>s.id===activeId);
    function notify(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3100)}
    function openModal(title,html,footer=''){ $('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalFoot').innerHTML=footer;$('#modal').showModal() }
    function closeModal(){ $('#modal').close() }
    function setView(next,id){view=next;if(id!==undefined)activeId=id;if(next==='session')tab='conversation';selectedResult=null;mentionOpen=false;askOpen=false;closeMobile();render()}
    function closeMobile(){mobileOpen=false;$('#side').classList.remove('open');$('#scrim').classList.add('hidden')}
    function login(){ $('#loginView').hidden=true;$('#appView').hidden=false;setView('home') }
    function logout(){ $('#appView').hidden=true;$('#loginView').hidden=false;view='login';activeId=null;closeMobile() }
    function newSession(){const id='demo-'+Date.now();sessions.unshift({id,title:'未命名研究',status:'准备中',updated:'刚刚',tokens:'—',messages:[],results:[],asked:false,report:'none',template:'市场观察报告'});setView('session',id);notify('已建立空白会话，可直接开始对话')}
    function renderSide(){ $('#navCount').textContent=sessions.length;$('#sideSessions').innerHTML=sessions.slice(0,4).map(s=>`<button class="sessionLink ${activeId===s.id&&view==='session'?'active':''}" data-open="${s.id}"><span class="sIcon">✦</span><span class="text"><span class="title">${esc(s.title)}</span><span class="meta">${esc(s.status)} · ${esc(s.updated)}</span></span></button>`).join('');$('#homeNav').classList.toggle('active',view==='home');$('#dataNav').classList.toggle('active',view==='dataHome');$('#reportsNav').classList.toggle('active',view==='reportsHome');$('#breadcrumb').innerHTML=view==='home'?'我的研究 <strong> / 全部会话</strong>':`我的研究 <strong> / ${esc(current()?.title || (view==='dataHome'?'研究数据':'报告成果'))}</strong>`;$('#topUsageValue').textContent='10,580 token（示例）'}
    function render(){renderSide();if(view==='home')return renderHome();if(view==='session')return renderSession();if(view==='dataHome')return renderDataHome();if(view==='reportsHome')return renderReportsHome()}
    function renderHome(){body.innerHTML=`<div class="viewTitle"><div><span class="eyebrow">MY RESEARCH</span><h1>早上好，研究者</h1><p>继续已有研究，或从一个新问题开始。</p></div></div><div class="homeIntro"><div><h2>一个问题，就是一段新的研究。</h2><p>先对话、查数，再决定是否启动专家团队生成报告。</p></div><button class="btn" data-action="new">＋ 新建会话</button></div><div class="homeStats"><div class="card stat"><small>我的会话</small><strong>${sessions.length}</strong><span>个 · 演示</span></div><div class="card stat"><small>待继续</small><strong>${sessions.filter(s=>s.status==='准备中').length}</strong><span>个 · 演示</span></div><div class="card stat"><small>已交付报告</small><strong>${sessions.filter(s=>s.report==='ready').length}</strong><span>份 · 演示</span></div></div><div class="sectionHeader"><h2>全部会话</h2><span class="spacer"></span><input id="searchSessions" type="search" placeholder="搜索会话" aria-label="搜索会话"></div><div id="homeRows" class="card homeRows"></div><p class="muted" style="font-size:12px;margin-top:13px">演示数据仅说明布局和交互；正式页面将按登录账号从服务端加载。</p>`;renderHomeRows('')}
    function renderHomeRows(q){let list=sessions.filter(s=>s.title.includes(q));$('#homeRows').innerHTML=list.length?list.map(s=>`<button class="homeRow" data-open="${s.id}"><span><strong>${esc(s.title)}</strong><small>${esc(s.updated)}更新 · ${esc(s.report==='ready'?'已有报告':'继续讨论或查数')}</small></span><span class="hidePhone"><span class="chip ${s.report==='ready'?'green':'amber'}">${esc(s.status)}</span></span><span class="hidePhone"><small>累计用量</small><strong class="mono">${esc(s.tokens)}</strong></span><span class="end">打开 →</span></button>`).join(''):`<div class="empty">没有匹配的会话。</div>`}
    function renderSession(){const s=current();if(!s)return setView('home');const status=s.report==='ready'?'报告已交付':s.report==='running'?'正在执行':s.report==='plan'?'待确认方案':'准备中';body.innerHTML=`<div class="sessionHeading"><div><span class="eyebrow">RESEARCH SESSION</span><h1>${esc(s.title)}</h1><p>示例客户账号 · ${esc(status)} · 你的会话与资料默认仅账号内可见</p></div><button class="btn ghost" data-action="rename">重命名</button></div><div class="tabbar" role="tablist" aria-label="会话页面"><button class="tab" role="tab" data-tab="conversation" aria-selected="${tab==='conversation'}">会话</button><button class="tab" role="tab" data-tab="workspace" aria-selected="${tab==='workspace'}">工作区</button><button class="tab" role="tab" data-tab="data" aria-selected="${tab==='data'}">数据 <span class="mono">${s.results.length||''}</span></button></div><div id="tabBody"></div>`;renderTab()}
    function renderTab(){const s=current();if(!s)return;body.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='conversation')renderConversation();if(tab==='workspace')renderWorkspace();if(tab==='data')renderData()}
    function renderConversation(){const s=current();const messages=s.messages.map(m=>`<div class="message ${m.who==='user'?'user':''}"><span class="face">${m.who==='user'?'我':'见'}</span><div class="bubble"><span class="who">${m.who==='user'?'我':'智见小秘书'}</span>${esc(m.text)}</div></div>`).join('');const ask=s.asked?'':`<div class="askCard"><span class="eyebrow">待你补充 · 可稍后回答</span><h3>这次研究更关注哪些方面？</h3><p>勾选建议项，也可在最后一行输入自己的要求。</p><label class="askOption"><input type="checkbox" value="趋势变化">趋势变化</label><label class="askOption"><input type="checkbox" value="区域差异">区域差异</label><label class="askOption"><input type="checkbox" value="客户决策建议">客户决策建议</label><label class="askOption"><input id="askOtherCheck" type="checkbox" value="自定义"><input id="askOtherText" type="text" placeholder="自定义补充（可选）" aria-label="自定义补充"></label><button class="btn" data-action="answer">提交回答</button></div>`;$('#tabBody').innerHTML=`<div class="sessionGrid"><div class="card conversationCard"><div class="convTop"><strong>与智见小秘书的会话</strong><span class="spacer"></span><span class="chip green"><i class="dot"></i>可自由提问</span></div><div class="convScroll" id="convScroll">${messages||`<div class="empty"><h2>从一个问题开始</h2><p>说说你关心的议题、范围或想找的数据。现在还不会启动报告任务。</p></div>`}${s.messages.length?ask:''}${s.results.length?`<div class="resultReceipt"><div class="receiptHead"><strong>▦ 已留存查询结果</strong><span class="spacer"></span><span class="chip neutral">${s.results.length} 项</span></div><p>查询结果先进入数据清单；选入报告材料需要再确认。</p><button class="textBtn" data-action="show-data">在数据中查看 →</button></div>`:''}</div><form id="compose" class="compose"><div id="mentionPopup" class="mentionPopup" hidden></div><textarea id="messageInput" placeholder="提出问题，或输入 @ 选择数据源、领域包、专家…" aria-label="输入会话消息"></textarea><div class="composeFoot"><small>Enter 发送 · Shift + Enter 换行</small><button class="btn" type="button" data-action="mention">@ 选择对象</button><button class="btn primary" type="submit">发送 ↗</button></div></form></div><aside><div class="card contextCard"><h3>这段研究的下一步</h3><p>先确认问题和材料；准备好后再生成报告方案。</p><div class="contextLine"><span>阶段</span><strong>${esc(s.report==='none'?'前期沟通':s.report==='ready'?'报告交付':s.report==='running'?'团队执行':'方案确认')}</strong></div><div class="contextLine"><span>查询结果</span><strong>${s.results.length} 项</strong></div><div class="contextLine"><span>本会话用量</span><strong class="mono">${esc(s.tokens)} token</strong></div><button class="btn primary full" data-action="prepare-report">生成报告方案</button></div><div class="hintCard"><strong>提示 · 三类 @ 对象</strong>可定向查询数据源、请领域包给出方法建议，或向专家提问。提及对象不会自动加入报告团队。</div></aside></div>`;if(mentionOpen)renderMentionPopup();$('#convScroll').scrollTop=$('#convScroll').scrollHeight}
    const mentions=[{type:'数据源',cls:'',name:'智见',desc:'查询演示数据',insert:'@智见'},{type:'领域包',cls:'pack',name:'居住市场研究',desc:'研究方法与口径',insert:'@居住市场研究'},{type:'专家',cls:'expert',name:'租赁市场专家',desc:'请专家给出观点',insert:'@租赁市场专家'}];
    function renderMentionPopup(){const pop=$('#mentionPopup');if(!pop)return;pop.hidden=false;pop.innerHTML='<div class="mentionTitle">可提及对象 · 数据源 / 领域包 / 专家</div>'+mentions.map(m=>`<button type="button" class="mentionItem" data-mention="${esc(m.insert)}"><span class="type ${m.cls}">${m.type}</span><strong>${esc(m.name)}</strong><small>${esc(m.desc)}</small></button>`).join('')}
    function sendMessage(text){const s=current();const value=text.trim();if(!value)return;s.messages.push({who:'user',text:value});if(s.title==='未命名研究')s.title=value.replace(/@\S+/g,'').trim().slice(0,18)||'新的研究会话';if(value.includes('@智见')){s.messages.push({who:'assistant',text:'演示查询已返回一份样例数据快照，并保存在“数据”中。数据表中的数值只是交互样本，不代表真实市场。'});s.results.push({...sampleResult(),id:'result-'+Date.now(),title:'本次提问的样例数据快照'});notify('示例查询结果已进入数据清单')}else if(value.includes('@居住市场研究'))s.messages.push({who:'assistant',text:'领域包建议：先明确研究区域、时间和指标口径，再讨论报告大纲。此处是演示答复。'});else if(value.includes('@租赁市场专家'))s.messages.push({who:'assistant',text:'专家建议：可以先对比不同区域，再结合证据解释差异。此处是演示答复。'});else s.messages.push({who:'assistant',text:'收到。我们可以继续明确研究目标、时间范围和报告受众。也可以输入 @智见 查询演示数据，或点击“生成报告方案”预览下一步。'});s.updated='刚刚';renderSide();renderSession();$('#messageInput').focus()}
    function answerQuestion(){const card=$('.askCard');if(!card)return;const options=[...card.querySelectorAll('.askOption input[type=checkbox]:checked')].map(x=>x.value).filter(x=>x!=='自定义');const own=$('#askOtherText').value.trim();if(!options.length&&!own)return notify('请选择至少一个选项，或输入自定义要求');if(own)options.push(own);const s=current();s.messages.push({who:'user',text:'研究重点：'+options.join('、')});s.messages.push({who:'assistant',text:'已记下这些重点。你仍可以继续沟通；正式计划和大纲会在工作区单独请你确认。'});s.asked=true;renderSession();notify('补充要求已记录')}
    function renderWorkspace(){const s=current();const hasPlan=s.report!=='none';const ready=s.report==='ready';const running=s.report==='running';$('#tabBody').innerHTML=`<div class="workspaceGrid"><section class="card panelPad"><span class="eyebrow">RESEARCH WORKSPACE</span><h2 style="margin-top:7px">${ready?'报告已交付':running?'专家团队正在执行':hasPlan?'请确认报告方案':'从讨论走向研究方案'}</h2><p>${ready?'可预览示例报告，并查看形成过程。':running?'此处展示阶段和回执。演示流程几秒后会自动到达交付状态。':hasPlan?'核对目标、材料、模板与预计消耗后，再确认启动。':'前期沟通不消耗报告执行额度。点击下方按钮，先生成一份可核对的方案。'}</p><div class="stageRail"><span class="stage done">1 前期沟通</span><span class="stage ${hasPlan?'done':'current'}">2 核对方案</span><span class="stage ${running?'current':ready?'done':''}">3 专家执行</span><span class="stage ${ready?'current':''}">4 报告交付</span></div>${hasPlan?`<div class="reportPreview"><div class="paperTitle">${esc(s.title)} · ${esc(s.template)}</div><p>目标：梳理议题与已有数据，形成有来源说明和明确边界的客户报告。</p><ul><li>已纳入材料：${s.results.filter(r=>r.selected).length} 项数据结果</li><li>拟用能力：已启用领域包、可用专家、报告模板</li><li>交付：HTML / PDF（演示状态）</li></ul></div>${ready?`<div class="artifact"><span style="font-size:24px">▤</span><span><strong>正式报告 · 演示版本 V1</strong><small>私有 · HTML 预览 · 示例产物</small></span><span class="spacer"></span><button class="btn" data-action="preview-report">预览</button></div>`:running?`<div class="runRow"><span class="stepIcon">✓</span><span><strong>已确认方案</strong><small>版本和材料已锁定</small></span><span class="duration chip green">已完成</span></div><div class="runRow"><span class="stepIcon">↻</span><span><strong>生成示例报告</strong><small>演示中 · 请稍候</small></span><span class="duration chip amber">进行中</span></div><button class="btn" data-action="stop-report">停止演示任务</button>`:`<div class="callout">确认前可继续修改模板或会话内容。这里的确认仅模拟流程，不会启动真实模型或团队。</div><button class="btn primary" data-action="confirm-report">确认方案并开始 →</button>`}`:`<div class="callout">可先去“会话”提问、查数；也可以直接生成一份演示方案。</div><button class="btn primary" data-action="prepare-report">生成报告方案 →</button>`}</section><aside><section class="card panelPad"><h2>方案核对</h2><label for="templateSelect" class="muted" style="font-size:12px">报告类型</label><select id="templateSelect" class="reportChoice"><option ${s.template==='市场观察报告'?'selected':''}>市场观察报告</option><option ${s.template==='综合研究报告'?'selected':''}>综合研究报告</option></select><div class="contextLine"><span>可用数据结果</span><strong>${s.results.length} 项</strong></div><div class="contextLine"><span>已选报告材料</span><strong>${s.results.filter(r=>r.selected).length} 项</strong></div><div class="contextLine"><span>预计用量</span><strong>执行前给出</strong></div><div class="contextLine"><span>访问范围</span><strong>账号内私有</strong></div><p style="margin-top:15px">正式产品会在此展示数据许可、专家可用性、额度预检和需人工确认的节点。</p></section><section class="card panelPad" style="margin-top:15px"><h2>交付与留痕</h2><ul class="planList"><li>方案确认后记录版本</li><li>数据快照与来源可回溯</li><li class="${ready?'':'pending'}">报告 HTML / PDF 交付</li><li class="${ready?'':'pending'}">下载与分享独立授权</li></ul>${ready?`<button class="btn full" data-action="download-report">下载示例 HTML</button>`:''}</section></aside></div>`}
    function renderData(){const s=current();const items=s.results;const selected=items.find(r=>r.id===selectedResult);$('#tabBody').innerHTML=`<div class="dataLayout"><section class="card dataList"><span class="eyebrow">DATA LIBRARY</span><h2 style="margin-top:6px">本会话查询结果</h2><small>先看清单，点击后再打开表格。</small>${items.length?items.map(r=>`<button class="dataItem ${selectedResult===r.id?'active':''}" data-result="${r.id}"><span class="chip ${r.selected?'green':'neutral'}">${r.selected?'已选入材料':'未选入材料'}</span><strong>${esc(r.title)}</strong><small>${esc(r.source)} · ${esc(r.queried)} · ${r.rows.length} 行</small></button>`).join(''):`<div class="empty"><h2>还没有查询结果</h2><p>在“会话”中输入 @智见 查询，结果会留在这里。</p><button class="btn" data-action="go-chat">去会话提问</button></div>`}</section><section class="card tablePane">${selected?`<span class="eyebrow">RESULT SNAPSHOT</span><h2 style="margin-top:6px">${esc(selected.title)}</h2><div class="tableMeta">${esc(selected.source)} · 演示快照 · 所有指标与数值均为示例，不用于真实决策。</div><div class="tableScroll"><table><thead><tr><th>区域</th><th>数据集</th><th>频率</th><th>口径</th><th>示例值</th></tr></thead><tbody>${selected.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="dataActions"><small>保存在本会话；加入报告材料需你单独确认。</small><button class="btn ${selected.selected?'':'primary'}" data-action="select-material">${selected.selected?'移出报告材料':'纳入报告材料'}</button></div>`:`<div class="empty"><h2>选择一项结果查看表格</h2><p>数据清单保留查询来源、状态与材料选择，表格只在点开后显示。</p></div>`}</section></div>`}
    function renderDataHome(){const all=sessions.flatMap(s=>s.results.map(r=>({s,r})));body.innerHTML=`<div class="viewTitle"><div><span class="eyebrow">MY DATA</span><h1>研究数据</h1><p>按会话查看已留存的查询结果。</p></div></div><div class="card homeRows">${all.length?all.map(({s,r})=>`<button class="homeRow" data-data-session="${s.id}" data-data-result="${r.id}"><span><strong>${esc(r.title)}</strong><small>${esc(s.title)} · ${esc(r.source)}</small></span><span class="hidePhone"><span class="chip neutral">演示快照</span></span><span class="hidePhone"><small>${r.rows.length} 行</small></span><span class="end">查看 →</span></button>`).join(''):'<div class="empty">还没有数据结果。</div>'}</div>`}
    function renderReportsHome(){const all=sessions.filter(s=>s.report==='ready');body.innerHTML=`<div class="viewTitle"><div><span class="eyebrow">REPORT ARCHIVE</span><h1>报告成果</h1><p>已交付版本默认仅在自己的客户账号内可见。</p></div></div><div class="card homeRows">${all.length?all.map(s=>`<button class="homeRow" data-report-session="${s.id}"><span><strong>${esc(s.title)} · 报告 V1</strong><small>正式报告 · 示例交付</small></span><span class="hidePhone"><span class="chip green">已交付</span></span><span class="hidePhone"><small>HTML / PDF</small></span><span class="end">查看 →</span></button>`).join(''):'<div class="empty">还没有已交付的报告。</div>'}</div>`}
    function prepareReport(){const s=current();if(s.report==='none')s.report='plan';tab='workspace';renderSession();notify('已生成演示方案，请核对后确认')}
    function confirmReport(){const s=current();if(s.report!=='plan')return;s.report='running';s.status='运行中';renderSession();notify('演示执行已开始');clearTimeout(reportTimer);const id=s.id;reportTimer=setTimeout(()=>{const x=sessions.find(v=>v.id===id);if(x&&x.report==='running'){x.report='ready';x.status='报告已交付';x.tokens=x.tokens==='—'?'1,280':x.tokens;renderSide();if(activeId===id&&view==='session')renderSession();notify('演示报告已交付，可在工作区预览')}},1800)}
    function stopReport(){const s=current();clearTimeout(reportTimer);s.report='plan';s.status='待确认方案';renderSession();notify('演示任务已停止，方案仍保留')}
    function reportHtml(s){return `<article class="reportSheet"><span class="eyebrow">示例报告 · V1</span><h3>${esc(s.title)}</h3><p>这是一份用于确认页面交付体验的示例报告。正式报告将包含真实研究问题、方法、可核验来源、数据表、结论与适用边界。</p><h4>一、研究问题</h4><p>围绕客户确认的议题开展研究，明确地区、时期、受众和报告用途。</p><h4>二、数据与证据</h4><p>本演示页面的所有表格均为虚构样例。真实产品应展示每项数据的来源、口径、时间与使用许可。</p><h4>三、交付说明</h4><p>报告默认私有，下载与对外分享应有独立授权与版本记录。</p></article>`}
    function downloadReport(){const s=current();const html=`<!doctype html><meta charset="utf-8"><title>${esc(s.title)} · 示例报告</title><style>body{max-width:760px;margin:50px auto;padding:20px;font:17px/1.8 sans-serif;color:#26362c}</style>${reportHtml(s)}`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='智见-示例报告.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('已下载示例 HTML；没有真实研究内容')}
    function usageModal(){openModal('我的用量 · 演示',`<p class="muted">以下数字只展示用量页面的结构，并非从模型服务读取。</p><table class="usageTable"><thead><tr><th>会话</th><th>状态</th><th>累计 token（示例）</th></tr></thead><tbody>${sessions.map(s=>`<tr><td>${esc(s.title)}</td><td>${esc(s.status)}</td><td class="mono">${esc(s.tokens)}</td></tr>`).join('')}</tbody></table><p class="muted" style="margin-top:18px">正式产品将区分输入、缓存读取、缓存写入、输出、未知用量，并提供按会话追溯。</p>`,'<button class="btn" data-action="close-modal">关闭</button>')}
    document.addEventListener('click',e=>{const loginBtn=e.target.closest('[data-login]');if(loginBtn){login();notify('已进入模拟账号 · '+loginBtn.dataset.login);return}const open=e.target.closest('[data-open]');if(open){setView('session',open.dataset.open);return}const tabBtn=e.target.closest('[data-tab]');if(tabBtn){tab=tabBtn.dataset.tab;selectedResult=null;renderTab();return}const result=e.target.closest('[data-result]');if(result){selectedResult=result.dataset.result;renderData();return}const mention=e.target.closest('[data-mention]');if(mention){const box=$('#messageInput');const value=box.value;box.value=/(^|\s)@[^\s]*$/.test(value)?value.replace(/(^|\s)@[^\s]*$/,'$1'+mention.dataset.mention+' '):(value.trimEnd()+' '+mention.dataset.mention+' ').trimStart();box.focus();mentionOpen=false;$('#mentionPopup').hidden=true;return}const dataSession=e.target.closest('[data-data-session]');if(dataSession){setView('session',dataSession.dataset.dataSession);tab='data';selectedResult=dataSession.dataset.dataResult;renderSession();return}const reportSession=e.target.closest('[data-report-session]');if(reportSession){setView('session',reportSession.dataset.reportSession);tab='workspace';renderSession();return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='new')newSession();if(action==='rename'){const s=current();openModal('重命名会话',`<label for="renameInput">会话名称</label><input id="renameInput" style="width:100%;margin-top:8px;padding:10px;border:1px solid var(--lineStrong);border-radius:9px" maxlength="50" value="${esc(s.title)}">`,'<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-name">保存</button>')}if(action==='save-name'){const value=$('#renameInput')?.value.trim();if(value){current().title=value;closeModal();render();notify('会话名称已更新')}}if(action==='close-modal')closeModal();if(action==='show-data'){tab='data';selectedResult=current().results[0]?.id;renderSession()}if(action==='go-chat'){tab='conversation';renderSession()}if(action==='mention'){mentionOpen=!mentionOpen;if(mentionOpen)renderMentionPopup();else $('#mentionPopup').hidden=true;$('#messageInput')?.focus()}if(action==='answer')answerQuestion();if(action==='prepare-report')prepareReport();if(action==='confirm-report')confirmReport();if(action==='stop-report')stopReport();if(action==='preview-report')openModal('报告预览 · 示例版本',reportHtml(current()),'<button class="btn" data-action="close-modal">关闭</button><button class="btn primary" data-action="download-report">下载示例 HTML</button>');if(action==='download-report')downloadReport();if(action==='select-material'){const r=current().results.find(v=>v.id===selectedResult);r.selected=!r.selected;renderData();notify(r.selected?'已纳入报告材料':'已移出报告材料')}});
    document.addEventListener('submit',e=>{if(e.target.id==='compose'){e.preventDefault();sendMessage($('#messageInput').value);mentionOpen=false}});
    document.addEventListener('keydown',e=>{if(e.target.id==='messageInput'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#compose').requestSubmit()}});
    document.addEventListener('input',e=>{if(e.target.id==='searchSessions')renderHomeRows(e.target.value.trim());if(e.target.id==='askOtherText'&&e.target.value.trim())$('#askOtherCheck').checked=true;if(e.target.id==='messageInput'){const v=e.target.value;const show=/(^|\s)@[^\s]*$/.test(v);if(show&&!mentionOpen){mentionOpen=true;renderMentionPopup()}else if(!show&&mentionOpen){mentionOpen=false;const pop=$('#mentionPopup');if(pop)pop.hidden=true}}});
    document.addEventListener('change',e=>{if(e.target.id==='templateSelect'){current().template=e.target.value;notify('报告类型已更新')}});
    $('#homeNav').addEventListener('click',()=>setView('home'));$('#dataNav').addEventListener('click',()=>setView('dataHome'));$('#reportsNav').addEventListener('click',()=>setView('reportsHome'));$('#newSide').addEventListener('click',newSession);$('#usageNav').addEventListener('click',usageModal);$('#accountBtn').addEventListener('click',()=>notify('演示账号：正式产品支持多账号成员资格与切换'));$('#profileBtn').addEventListener('click',()=>notify('当前为示例客户账号'));$('#logout').addEventListener('click',logout);$('#modalClose').addEventListener('click',closeModal);$('#menuBtn').addEventListener('click',()=>{mobileOpen=true;$('#side').classList.add('open');$('#scrim').classList.remove('hidden')});$('#scrim').addEventListener('click',closeMobile);
  </script>
</body>
</html>
