<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="split-band"><g data-audit-rect="0,0,1280,224"><rect x="0" y="0" width="1280" height="224" fill="#0A4E72"></rect><g data-audit-box="0,0,1280,224"><text x="96" y="120" font-family="Georgia, Songti SC, STSong, serif" font-size="44" font-weight="700" fill="#FFFFFF" dominant-baseline="alphabetic">不确定性：主基调下修的五种条件</text></g></g><g data-audit-rect="96,240,1088,400"><g data-audit-box="96,240,1088"><g transform="translate(96,240)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#23262C" dominant-baseline="alphabetic">确权公共化（最大风险）：释放确权若收归公共流程，平台须迁移至机制C</text><text x="0" y="68" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#23262C" dominant-baseline="alphabetic">上海式全程网办若封闭不开放接口，平台信息权被压缩</text><text x="0" y="110" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#23262C" dominant-baseline="alphabetic">监管悖论：过户时长拉长且无法压缩，资金可能走向地下交割</text><text x="0" y="152" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#23262C" dominant-baseline="alphabetic">佣金专户化拉长结算周期，加速行业集中</text><text x="0" y="194" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#23262C" dominant-baseline="alphabetic">垫付86.3万规模极小，可持续性取决于风险模型表现</text></g></g><g data-audit-box="96,484,1088"><g transform="translate(96,484)"><rect x="0" y="0" width="1088" height="103" rx="2" fill="#DC2626"></rect><rect x="0" y="3" width="1088" height="100" rx="2" fill="#FFFFFF"></rect><g transform="translate(14,43) scale(0.8333333333333334)"><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 9v4"></path><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 17h.01"></path></g><text x="44" y="43" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#23262C" dominant-baseline="alphabetic">以上为研判推断，须以官方口径数据验证；在途利息约2,200万/城/年、拦截面约1,400亿元为自</text><text x="44" y="77" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#23262C" dominant-baseline="alphabetic">算框架值。</text></g></g></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#DCDAD0" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">1.0 · 2026-08-23</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Public · 智见点评</text></svg>