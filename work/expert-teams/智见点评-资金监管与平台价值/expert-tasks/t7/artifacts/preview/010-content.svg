报/红网/央广网：「房款安全」27城/7.1万单/垫付86.3万（2026-06-26）；湖南日报（2026-06）</text><text x="0" y="242" font-family="Georgia, Songti SC, STSong, serif" font-size="18" fill="#23262C" dominant-baseline="alphabetic">[9] 新华社/财经网：协同共治民生观察（2026-08-19/21）</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#5D626A" font-style="italic" dominant-baseline="alphabetic">自算框架值：在途利息2,200万/城/年（270亿×约15天×活期0.2%）；拦截面≈1,400亿（单均约200万×7.1万单，单均未披露，引用需谨慎）。预测部分均属研判推断。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#DCDAD0" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">1.0 · 2026-08-23</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Public · 智见点评</text></svg>