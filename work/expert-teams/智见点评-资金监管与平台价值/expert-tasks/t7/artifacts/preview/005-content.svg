<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><rect x="1216" y="44" width="10" height="10" fill="#0A4E72" opacity="0.85"></rect></g><g data-archetype="quiet-frame"><text x="640" y="180" text-anchor="middle" font-family="Georgia, Songti SC, STSong, serif" font-size="40" font-weight="600" fill="#23262C" dominant-baseline="alphabetic">平台行为：从「资金保管人」到「风险拦截者</text><text x="640" y="223" text-anchor="middle" font-family="Georgia, Songti SC, STSong, serif" font-size="40" font-weight="600" fill="#23262C" dominant-baseline="alphabetic">+ 兜底承诺人」</text><rect x="616" y="243" width="48" height="3" rx="1.5" fill="#C8962E"></rect><g data-audit-rect="200,271,880,349"><g data-audit-box="200,271,880"><g transform="translate(200,271)"><g><rect x="0" y="0" width="208" height="120" rx="2" fill="#FFFFFF"></rect><text x="20" y="58" font-size="40" font-weight="bold" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">27<tspan font-size="18" fill="#5D626A">城</tspan></text><text x="20" y="96" font-size="16" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">「房款安全」覆盖城市</text></g><g><rect x="224" y="0" width="208" height="120" rx="2" fill="#FFFFFF"></rect><text x="244" y="58" font-size="40" font-weight="bold" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">7.1<tspan font-size="18" fill="#5D626A">万单</tspan></text><text x="244" y="96" font-size="16" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">风险拦截单量</text></g><g><rect x="448" y="0" width="208" height="120" rx="2" fill="#FFFFFF"></rect><text x="468" y="58" font-size="37" font-weight="bold" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">86.3<tspan font-size="17" fill="#5D626A">万元</tspan></text><text x="468" y="96" font-size="15" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">累计垫付（每单约12元）</text></g><g><rect x="672" y="0" width="208" height="120" rx="2" fill="#FFFFFF"></rect><text x="692" y="58" font-size="30" font-weight="bold" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">≈1,400<tspan font-size="14" fill="#5D626A">亿元</tspan></text><text x="692" y="96" font-size="14" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">风险拦截面（自算框架值）</text></g></g></g><g data-audit-box="200,407,880"><g><rect x="200" y="407" width="880" height="169" rx="2" fill="#FFFFFF"></rect><path d="M 200 409 A 2 2 0 0 1 202 407 L 1078 407 A 2 2 0 0 1 1080 409 L 1080 413 L 200 413 Z" fill="#C8962E"></path><text x="222" y="444" font-size="17" font-weight="700" fill="#0A0E14" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">账本结构的经济实质</text><g><text x="222" y="476" font-size="14" font-weight="700" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">事前拦截是主体</text><text x="334" y="475.5" font-size="13.5" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">垫付金额之小恰恰说明规则与流程的价值大于兜底资金本身；大额风险已由监管专户承接，平台只兜缝隙</text></g><g><text x="222" y="512" font-size="14" font-weight="700" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">实质是信息能力</text><text x="334" y="511.5" font-size="13.5" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">兜底承诺的经济实质是信息能力而非资金能力；行业该警惕的是垫付金额快速膨胀——那说明事前拦截失效</text></g><text x="222" y="556" font-size="12" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">数据来源：新快报/红网/央广网（2026-06-26）；湖南日报（2026-06）</text></g></g></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#DCDAD0" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">1.0 · 2026-08-23</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Public · 智见点评</text></svg>