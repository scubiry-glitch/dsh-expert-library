<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="tone-adaptive-content"><text x="64" y="130" font-family="Georgia, Songti SC, STSong, serif" font-size="46" font-weight="700" fill="#23262C" dominant-baseline="alphabetic">对外话术：政府管底座，平台管节点</text><line x1="64" y1="162" x2="112" y2="162" stroke="#C8962E" stroke-width="4"></line><line x1="112" y1="162" x2="1216" y2="162" stroke="#DCDAD0" stroke-width="1.6"></line><g data-audit-rect="64,180,1152,460"><g data-audit-box="64,315.28,1152"><g transform="translate(64,315.28)" data-audit-box="64,315.28,1152" data-audit-rect="64,315.28,1152,104"><line x1="64" y1="2" x2="1152" y2="2" stroke="#DCDAD0" stroke-width="1"></line><rect x="0" y="0" width="64" height="4" fill="#2E9E6B"></rect><text x="0" y="46" font-family="Georgia, Songti SC, STSong, serif" font-size="26" font-weight="600" fill="#23262C" dominant-baseline="alphabetic">资金监管不是平台价值的终结者，而是平台价值从「沉淀收益」迁移到「确定性溢价」的催化剂 ——</text><text x="0" y="80" font-family="Georgia, Songti SC, STSong, serif" font-size="26" font-weight="600" fill="#23262C" dominant-baseline="alphabetic">是分工，不是替代。</text></g></g></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#DCDAD0" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">1.0 · 2026-08-23</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Public · 智见点评</text></svg>