="alphabetic">信息成本不灭</text><text x="306" y="105" font-size="8" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">释放条件依赖的节点状态分散在银行、登记、税务各</text><text x="306" y="116" font-size="8" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">系统——谁采集验证传递得快，谁掌握交易节奏</text></g><g data-audit-box="660,330.22,242"><rect x="564" y="0" width="242" height="143" rx="8" fill="#FFFFFF"></rect><circle cx="602" cy="38" r="14" fill="#0A4E72"></circle><text x="602" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">3</text><text x="588" y="82" font-size="18" font-weight="600" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">制度根源</text><text x="588" y="106" font-size="9" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">监管账户化是行业公信力缺位的制度补位；行</text><text x="588" y="119" font-size="9" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">业被从「靠资金背书」逼向「靠服务定价」</text></g><g data-audit-box="942,330.22,242"><rect x="846" y="0" width="242" height="143" rx="8" fill="#FFFFFF"></rect><circle cx="884" cy="38" r="14" fill="#0A4E72"></circle><text x="884" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">4</text><text x="870" y="82" font-size="18" font-weight="600" fill="#23262C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">国际对照</text><text x="870" y="105" font-size="8" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">美国escrow/Title百年分离，NAR/MLS下经纪业繁</text><text x="870" y="116" font-size="8" fill="#5D626A" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">荣至今——资金底座与经纪价值可分离且互相成就</text></g><