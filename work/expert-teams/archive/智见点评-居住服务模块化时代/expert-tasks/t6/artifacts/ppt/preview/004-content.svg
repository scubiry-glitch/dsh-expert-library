<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#e9eef0"></rect><g data-archetype="tone-adaptive-content"><text x="64" y="130" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" font-size="46" font-weight="700" fill="#13262e" dominant-baseline="alphabetic">边界条件：基调下修的四个前提</text><line x1="64" y1="162" x2="112" y2="162" stroke="#a86f10" stroke-width="4"></line><line x1="112" y1="162" x2="1216" y2="162" stroke="#d8e2e5" stroke-width="1.6"></line><g data-audit-rect="64,180,1152,420"><g data-audit-box="64,200.52,1152"><g transform="translate(64,200.52)"><g data-audit-box="64,200.52,1152"><rect x="0" y="0" width="1152" height="81" rx="10" fill="#ffffff" stroke="#dde6e9" stroke-width="1"></rect><circle cx="46" cy="40.5" r="19" fill="none" stroke="#4e6874" stroke-width="1.5"></circle><text x="46" y="46.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">1</text><g transform="translate(88,18) scale(0.8333333333333334)"><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v18"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m19 8 3 8a5 5 0 0 1-6 0zV7"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m5 8 3 8a5 5 0 0 1-6 0zV7"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 21h10"></path></g><text x="118" y="35" font-size="19" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">分账与责任两道门槛（Y）</text><text x="88" y="59" font-size="15" fill="#13262e" fill-opacity="0.85" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">可单独付费尚未全面成立；ACN 需从房客源分佣升级为角色模块分账，责任界定先行。</text></g><g data-audit-box="64,295.52,1152"><rect x="0" y="95" width="1152" height="81" rx="10" fill="#ffffff" stroke="#dde6e9" stroke-width="1"></rect><circle cx="46" cy="135.5" r="19" fill="none" stroke="#4e6874" stroke-width="1.5"></circle><text x="46" y="141.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">2</text><g transform="translate(88,113) scale(0.8333333333333334)"><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 12 2 2 4-4"></path></g><text x="118" y="130" font-size="19" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">三个制度条件（L）</text><text x="88" y="154" font-size="15" fill="#13262e" fill-opacity="0.85" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">结果可验证 · 分账可执行 · 责任可追偿；窗口期约 12–18 个月（研判推断）。</text></g><g data-audit-box="64,390.52,1152"><rect x="0" y="190" width="1152" height="81" rx="10" fill="#ffffff" stroke="#dde6e9" stroke-width="1"></rect><circle cx="46" cy="230.5" r="19" fill="none" stroke="#4e6874" stroke-width="1.5"></circle><text x="46" y="236.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">3</text><g transform="translate(88,208) scale(0.8333333333333334)"><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m16 16 6-6"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21.5 10.5-8-8"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m8 8 6-6"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m8.5 7.5 8 8"></path></g><text x="118" y="225" font-size="19" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">从业制度迟到补课（X）</text><text x="88" y="249" font-size="15" fill="#13262e" fill-opacity="0.85" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">只拆责任不建制度，会把一人包办的模糊责任升级为无人负责的碎片化甩锅。</text></g><g data-audit-box="64,485.52,1152"><rect x="0" y="285" width="1152" height="81" rx="10" fill="#ffffff" stroke="#dde6e9" stroke-width="1"></rect><circle cx="46" cy="325.5" r="19" fill="none" stroke="#4e6874" stroke-width="1.5"></circle><text x="46" y="331.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">4</text><g transform="translate(88,303) scale(0.8333333333333334)"><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path stroke="#a86f10" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></g><text x="118" y="320" font-size="19" font-weight="bold" fill="#13262e" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">不破坏 ACN 协同（C）</text><text x="88" y="344" font-size="15" fill="#13262e" fill-opacity="0.85" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">模块结果必须可验证、付费与成交脱钩可单列，否则模块化退化为变相提佣。</text></g></g></g></g><text x="64" y="688" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" font-size="20" fill="#4e6874" font-style="italic" dominant-baseline="alphabetic">偏离观点降级规则：任一条件不成立，主基调需下修。匿名标注：Y 渠道崛起派 · C 存量统筹派 · L 制度派 · X 海外监管派</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#d8e2e5" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#4e6874" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">Internal · 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#4e6874" font-family="Microsoft YaHei, PingFang SC, Helvetica Neue, sans-serif" dominant-baseline="alphabetic">讨论稿 v1 · 2026-08</text></svg>