<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="image-lead-split"><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="38" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">行动计划：做什么 / 谁负责 / 交付物</text><g data-audit-rect="96,190,788,426"><g data-audit-box="96,241.68,788"><g transform="translate(96,241.68)"><text x="32" y="28" text-anchor="middle" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="18" font-weight="bold" dominant-baseline="alphabetic">序</text><text x="76" y="28" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="18" font-weight="bold" dominant-baseline="alphabetic">做什么</text><text x="529.4334832055011" y="28" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="18" font-weight="bold" dominant-baseline="alphabetic">谁负责</text><text x="691.4287225601693" y="28" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="18" font-weight="bold" dominant-baseline="alphabetic">交付物</text><line x1="0" y1="44" x2="788" y2="44" stroke="#051C2C" stroke-width="2"></line><line x1="0" y1="88" x2="788" y2="88" stroke="#D5D5CB" stroke-width="1"></line><line x1="0" y1="132" x2="788" y2="132" stroke="#D5D5CB" stroke-width="1"></line><line x1="0" y1="176" x2="788" y2="176" stroke="#D5D5CB" stroke-width="1"></line><line x1="0" y1="220" x2="788" y2="220" stroke="#D5D5CB" stroke-width="1"></line><line x1="0" y1="264" x2="788" y2="264" stroke="#D5D5CB" stroke-width="1"></line><g><text x="32" y="72" text-anchor="middle" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">1</text><text x="76" y="72" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">确定 3 试点 + 3 同能级对照分行；定各线责任人</text><text x="529.4334832055011" y="72" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">零售部</text><text x="691.4287225601693" y="72" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">试点方案</text></g><g><text x="32" y="116" text-anchor="middle" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">2</text><text x="76" y="116" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">口径字典定稿发布（日均 AUM 含表外、转化链定义）</text><text x="529.4334832055011" y="116" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">总行数据管理部</text><text x="691.4287225601693" y="115" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="15" font-weight="normal" dominant-baseline="alphabetic">口径字典 v1</text></g><g><text x="32" y="160" text-anchor="middle" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">3</text><text x="76" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">取数接口联调 + 基线快照（不补基线则差分无可比）</text><text x="529.4334832055011" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">数据管理部+科技部</text><text x="691.4287225601693" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">基线快照</text></g><g><text x="32" y="204" text-anchor="middle" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">4</text><text x="76" y="204" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">差分初判：控 β 后净人效 &lt;10% 撤回 α</text><text x="529.4334832055011" y="204" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">零售部+试点分行</text><text x="691.4287225601693" y="204" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">差分报告</text></g><g><text x="32" y="248" text-anchor="middle" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">5</text><text x="76" y="248" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">AI 证据：两档转化率 ≥ 人工基线且成本不升 → 扩点</text><text x="529.4334832055011" y="248" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">零售部+科技部</text><text x="691.4287225601693" y="247" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">AI 验证报告</text></g><text x="0" y="284" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="12" dominant-baseline="alphabetic">不设时间节点，由零售部牵头会商后定；用现有数据中台不新建系统（梁斌）；人天估算 2-3 个月（待补）。</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="13" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">试点：长三角同能级 3+3；先消费贷→信用卡激活→电销/线上随口径字典展开。禁止：分行自行加码排名、自建场景系统、观察期内排名。</text><g data-audit-rect="924,72,260,568"><rect x="924" y="72" width="260" height="568" rx="20" fill="#FFFFFF"></rect><rect x="924.5" y="72.5" width="259" height="567" rx="20" fill="none" stroke="#D5D5CB" stroke-width="1"></rect><circle cx="1054" cy="356" r="57.2" fill="#051C2C" fill-opacity="0.1"></circle><rect x="1022" y="441.2" width="64" height="4" rx="2" fill="#FFC72C"></rect></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">运营版 v2（可落地版 · 三轮质询已并入） · 2026-08-25</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text></svg>