<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><rect x="1216" y="44" width="10" height="10" fill="#051C2C" opacity="0.85"></rect></g><g data-archetype="quiet-frame"><text x="640" y="180" text-anchor="middle" font-family="Georgia, Songti SC, STSong, serif" font-size="40" font-weight="600" fill="#051C2C" dominant-baseline="alphabetic">1 分钟结论：五句话讲清楚</text><rect x="616" y="200" width="48" height="3" rx="1.5" fill="#FFC72C"></rect><g data-audit-rect="320,228,640,372"><g data-audit-box="320,242.44,640"><g transform="translate(320,242.44)"><text x="0" y="22" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">人效怎么提：已授信客户重配管户 + AI 主动促支，用信率≈12%</tspan></text><text x="0" y="50" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">是转化洞（方法 A）</text><text x="0" y="86" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">AI 怎么上：规则能写清楚的环节先试点；人工基线测 6 个月，AI</tspan></text><text x="0" y="114" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">辅助/AI 自主两档验证（方法 B）</text><text x="0" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">场景怎么做：装修贷促转化 + 统一商机池 + 智能路由 +</tspan></text><text x="0" y="178" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">全渠道归因（方法 C）</text><text x="0" y="214" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">怎么证明有效：口径字典 → 6 分行 90 天差分 → 净人效 &lt;10%</tspan></text><text x="0" y="242" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">记市场红利（方法 D）</text><text x="0" y="278" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">什么不能碰：数据安全四原则 +</tspan></text><text x="0" y="306" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">委员会评审前置，一票否决；四样不放手</text></g></g></g><text x="640" y="648" text-anchor="middle" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">贝壳 α 数字均为内部单源（管理层 S 分享 08-21），只作方向性参考；行内数据标注待补。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">运营版 v2（可落地版 · 三轮质询已并入） · 2026-08-25</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text></svg>