-size="19" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">方法 A · 管户重配法</text><text x="88" y="59" font-size="15" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">尾部零产出管户收归头部 + AI 辅助承接。零开单率 25%→&lt;10%（内部单源）主要来自 0 变 1 尾部修复</text><text x="88" y="83" font-size="13.5" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">验证：零产单占比月度通报；同店 AUM/人净增（控 β 差分）；P25 尾部产出占比</text></g><g data-audit-box="96,288.53999999999996,1088"><rect x="0" y="115" width="1088" height="101" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><circle cx="46" cy="165.5" r="19" fill="none" stroke="#6B6B6B" stroke-width="1.5"></circle><text x="46" y="171.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">2</text><g transform="translate(88,133) scale(0.8333333333333334)"><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 8V4H8"></path><rect stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="4" y="8" width="16" height="12" rx="2"></rect><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 14h2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 14h2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 13v2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 13v2"></path></g><text x="118" y="150" font-size="19" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">方法 B · AI 提效法</text><text x="88" y="174" font-size="15" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">规则能写清楚的环节用 AI，风险定价与终审人工兜底。净降本 20-30% 到头，不是 10 倍</text><text x="88" y="198" font-size="13.5" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">验证：转化率 ≥ 人工基线且单客成本不升（6 个月）；AI 进件占比监测；12 个月无证据即撤</text></g><g data-audit-box="96,403.53999999999996,1088"><rect x="0" y="230" width="1088" height="101" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><circle cx="46" cy="280.5" r="19" fill="none" stroke="#6B6B6B" stroke-width="1.5"></circle><text x="46" y="286.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">3</text><g transform="translate(88,248) scale(0.8333333333333334)"><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m11 17 2 2a1 1 0 1 0 3-3"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21 3 1 11h-2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 4h8"></path></g><text x="118" y="265" font-size="19" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">方法 C · 场景获客法</text><text x="88" y="289" font-size="15" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">按场景转化付费而非按网点成本付费。装修贷/高端卡/私行沙龙/政银协同都是渠道产能重定价</text><text x="88" y="313" font-size="13.5" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">验证：交叉销售率 ≥30% + 结算资金沉淀；沙龙达标户/场；权益互换新增达标户数</text></g><g data-audit-box="96,518.54,1088"><rect x="0" y="345" width="1088" height="101" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><circle cx="46" cy="395.5" r="19" fill="none" stroke="#6B6B6B" stroke-width="1.5"></circle><text x="46" y="401.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">4</text><g transform="translate(88,363) scale(0.8333333333333334)"><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m12 14 4-4"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3.34 19a10 10 0 1 1 17.32 0"></path></g><text x="118" y="380" font-size="19" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">方法 D · 数据与验证法</text><text x="88" y="404" font-size="15" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">把效率叙事变成可证伪工程：同店口径 + α/β 剥离 + 对照差分——其他三个方法的裁判</text><text x="88" y="428" font-size="13.5" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">验证：口径字典定稿 / 基线快照 / 差分初判 / AI 证据（时间节点后续再定）</text></g></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">行内止损先例：AI 终端消费贷 30/90/180 止损（99wiki 08-18）、电销 12 个月净贡献 ≤0 即撤（99wiki 08-09）。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">运营版 v2（可落地版 · 三轮质询已并入） · 2026-08-25</text><text x="1224" y="700" font-size="20" text-anchor="end" fi