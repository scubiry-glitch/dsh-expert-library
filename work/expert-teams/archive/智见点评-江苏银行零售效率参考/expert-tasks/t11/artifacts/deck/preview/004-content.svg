oke-linecap="round" stroke-linejoin="round" cx="9" cy="7" r="4"></circle></g><text x="118" y="35" font-size="19" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">线1 人效重构（现在干）</text><text x="88" y="59" font-size="15" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">管户重配 SOP + 考核绑定；验收 = 同店管户 AUM/人 净增（控 β 差分）</text><text x="88" y="83" font-size="13.5" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">关键数字：零开单率 25%→&lt;10%（贝壳内部单源）</text></g><g data-audit-box="96,323.42,632"><rect x="0" y="115" width="632" height="122" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><circle cx="46" cy="176" r="19" fill="none" stroke="#6B6B6B" stroke-width="1.5"></circle><text x="46" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">2</text><g transform="translate(88,133) scale(0.8333333333333334)"><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 8V4H8"></path><rect stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="4" y="8" width="16" height="12" rx="2"></rect><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 14h2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 14h2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 13v2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 13v2"></path></g><text x="118" y="150" font-size="19" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">线2 AI 规模化（试点验证）</text><text x="88" y="174" font-size="15" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">证伪 = 商机转化率 ≥ 人工基线 且 单客成本不升（6 个月）；AI 辅助 / AI</text><text x="88" y="195" font-size="15" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">自主两档验证</text><text x="88" y="219" font-size="13.5" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">关键数字：人工基线 = 试点前 6 个月同渠道人工转化率（差分前测）</text></g><g data-audit-box="96,459.42,632"><rect x="0" y="251" width="632" height="120" rx="2" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><circle cx="46" cy="311" r="19" fill="none" stroke="#6B6B6B" stroke-width="1.5"></circle><text x="46" y="317" text-anchor="middle" font-size="16" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">3</text><g transform="translate(88,269) scale(0.8333333333333334)"><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m11 17 2 2a1 1 0 1 0 3-3"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21 3 1 11h-2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 4h8"></path></g><text x="118" y="286" font-size="19" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">线3 场景生态获客（现在干 + 观察分层）</text><text x="88" y="309" font-size="14" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">双目标 = 交叉销售率 ≥ 30% + 结算资金日均沉淀额；渠道协同三件套（统一商机池 +</text><text x="88" y="329" font-size="14" fill="#051C2C" fill-opacity="0.85" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">智能路由 + 全渠道归因）</text><text x="88" y="353" font-size="13.5" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">关键数字：装修贷年化 3% 起；私行 6+3 场；首触 + 成交分账</text></g></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">三线不是同一优先级；数据安全四原则为跨线闸门（梁斌 · dealbreaker 一票否决）；验证协议写入考核。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v3（三轮质询已并入） · 2026-08-25</text></svg>