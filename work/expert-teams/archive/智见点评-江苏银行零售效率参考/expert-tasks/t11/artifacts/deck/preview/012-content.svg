SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">98wiki 素材（可核实）</text><text x="228.504132231405" y="71" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="13" font-weight="normal" dominant-baseline="alphabetic">装修贷年化 3% 起、单户 50 万 / 上限 300 万、价内加价约 6%</text><text x="635.9421487603306" y="72" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">2026-08-18 版方案口径；加价计入综合融资成本</text></g><g><text x="12" y="116" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">98wiki 素材（可核实）</text><text x="228.504132231405" y="115" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">Token 先享试单授信 2,800 万；成熟 5 亿在贷；私行 6+3 场</text><text x="635.9421487603306" y="115" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="13" font-weight="normal" dominant-baseline="alphabetic">中行广州已落地；占比 0.03% = 入口非引擎；上海试点覆盖南通/苏州/无锡</text></g><g><text x="12" y="159" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">今日贝壳研究（公开可核实）</text><text x="228.504132231405" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">二手单量 +近两成、利润率 14.6%、净利 38.79 亿</text><text x="635.9421487603306" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">财新 08-22 / 搜狐等 08-22；β 占六成为专家估算</text></g><g><text x="12" y="202" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">管理层 S 分享 08-21（内部单源）</text><text x="228.504132231405" y="203" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="13" font-weight="normal" dominant-baseline="alphabetic">人效 3→5.6 单（+87%）、零开单率 25%→&lt;10%、转带看 7.4% vs 5%</text><text x="635.9421487603306" y="204" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">内部单源未获独立验证；同店口径、成本/单未披露</text></g><g><text x="12" y="247" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">数据安全专项（梁斌必补项）</text><text x="228.504132231405" y="247" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">四原则：最小必要 / 共享必授权 / 数据不出行 / 流转必留痕</text><text x="635.9421487603306" y="247" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="15" font-weight="normal" dominant-baseline="alphabetic">个保法第 13 条单独授权；名单可用不可见；委员会评审一票否决</text></g><g><text x="12" y="292" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">人工基线（梁斌）</text><text x="228.504132231405" y="292" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">试点分行试点前 6 个月同渠道人工转化率</text><text x="635.9421487603306" y="292" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">差分前测，非全行均值；AI 辅助 / AI 自主两档验证</text></g><g><text x="12" y="336" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">渠道协同三件套（梁斌）</text><text x="228.504132231405" y="336" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">统一商机池 + 智能路由 + 全渠道归因</text><text x="635.9421487603306" y="336" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">首触 + 成交分账；禁止分行自建</text></g><g><text x="12" y="380" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">行内数据</text><text x="228.504132231405" y="379" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">零产单率、人均 AUM、单客成本、交叉销售率现值、人天估算</text><text x="635.9421487603306" y="380" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">全部标注「待补」；证伪线须口径字典上线后核实</text></g><text x="0" y="416" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="12" dominant-baseline="alphabetic">98wiki 知识库素材 + 今日贝壳研究 + 三轮质询修订（2026-08-25）</text></g></g></g><text x="96" y="652" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">心智模型：同店口径 · α/β 剥离 · 差分验证 · 成本 BOM · 政银协同 · 数据安全四原则 · 人工基线 · 统一商机池。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v3（三轮质询已并入） · 2026-08-25</text></svg>