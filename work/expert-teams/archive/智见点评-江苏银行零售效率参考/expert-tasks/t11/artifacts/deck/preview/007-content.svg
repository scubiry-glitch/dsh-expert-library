<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="banner-heading"><rect x="96" y="72" width="1088" height="88" rx="2" fill="#051C2C"></rect><text x="120" y="127" font-family="Georgia, Songti SC, STSong, serif" font-size="34" font-weight="600" fill="#FFFFFF" dominant-baseline="alphabetic">线3 场景生态获客：渠道协同三件套</text><g data-audit-rect="96,192,1088,428"><g data-audit-box="96,192,1088"><g transform="translate(96,192)"><rect x="0" y="0" width="1088" height="91" rx="2" fill="#FFC72C"></rect><rect x="0" y="3" width="1088" height="88" rx="2" fill="#FFFFFF"></rect><g transform="translate(14,37) scale(0.8333333333333334)"><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m11 17 2 2a1 1 0 1 0 3-3"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21 3 1 11h-2"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"></path><path stroke="#FFC72C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 4h8"></path></g><text x="44" y="39" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">双目标（高增银裁定）：交叉销售率 ≥ 30%（装修贷客户持有 ≥2 类零售产品）+</text><text x="44" y="67" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">受托支付分节点放款留存的结算资金日均沉淀额。无中收与沉淀双目标，场景线就是赔本赚吆喝。</text></g></g><g data-audit-box="96,299,1088"><g transform="translate(96,299)"><text x="0" y="22" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">装修贷「促转化」定位直接落地：年化 3% 起、单户 50 万 / 上限 300 万、受托支付 + 分节点放款</tspan></text><text x="0" y="58" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">价内加价约 6% 由装修商贴息——计入客户综合融资成本口径（袁军修订）；补第三方核验凭证</tspan></text><text x="0" y="94" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">高净值共营：私行 12 场中 6 场插课 + 3 场专场（上海试点覆盖南通/苏州/无锡）</tspan></text><text x="0" y="130" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">补「新增私行达标户/场、AUM 净增/场」两指标；权益互换钻石卡 600 万→200 万，合规审查前置</tspan></text><text x="0" y="166" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">Token 先享：只埋接口不启动（0.03% 占比 = 入口非引擎）</tspan></text><text x="0" y="202" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">政银协同第三层（袁军必补项）：数据共享 + 白名单预授信 + 财政贴息联动</tspan></text><text x="0" y="238" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">渠道协同三件套（梁斌）：统一商机池 + 智能路由 + 全渠道归因（首触 + 成交分账）</tspan></text><text x="0" y="274" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">简易需求线上闭环（手机银行 / 远程银行）、复杂高净值路由重渠道（网点 / 私行）；禁止各分行自建场景系统</tspan></text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">红线（王一帆）：「装修贷是促转化不是卖金融产品」；按场景转化付费而非按网点成本付费（杨现领）；数据安全四原则为跨线闸门。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v3（三轮质询已并入） · 2026-08-25</text></svg>