fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">施工图三缺（责任/节点/考核）必须补齐</text><text x="766.3172413793103" y="71" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">①③需修改、②数据安全必补、④条件可接受</text><text x="12" y="115" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="bold" dominant-baseline="alphabetic">修订 1</text><text x="92" y="115" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">装修贷加价计入综合融资成本口径</text><text x="458.4551724137931" y="115" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">施工图钉死：T+15/T+30/T+90/T+180</text><text x="766.3172413793103" y="115" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">AI 线：人工基线差分前测 + 两档验证</text><text x="12" y="159" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="bold" dominant-baseline="alphabetic">修订 2</text><text x="92" y="159" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">权益互换合规审查前置</text><text x="458.4551724137931" y="159" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">人效考核双层：分行差分 + 个人双因子</text><text x="766.3172413793103" y="159" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">数据安全必补：四原则 + 委员会评审一票否决</text><text x="12" y="203" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="bold" dominant-baseline="alphabetic">修订 3</text><text x="92" y="203" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">政银协同第三层（必补项）</text><text x="458.4551724137931" y="203" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">AI 证伪重设：30% 进件占比降为监测指标</text><text x="766.3172413793103" y="203" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">场景线：渠道协同三件套，禁止分行自建</text><text x="12" y="247" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="bold" dominant-baseline="alphabetic">考核落地</text><text x="92" y="247" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">α/β 分账、90 天不排名、撤点不追责</text><text x="458.4551724137931" y="247" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">场景双目标：交叉 ≥30% + 资金沉淀</text><text x="766.3172413793103" y="247" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">T+15/T+30 拆里程碑 + 基线快照</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">领导质询以「领导质询」标注区并入融合稿 v3（袁军 / 高增银 / 梁斌三轮）。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v3（三轮质询已并入） · 2026-08-25</text></svg>