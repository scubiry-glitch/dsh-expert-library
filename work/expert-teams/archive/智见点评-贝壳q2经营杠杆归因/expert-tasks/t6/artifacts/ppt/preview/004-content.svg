<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="banner-heading"><rect x="96" y="72" width="1088" height="88" rx="2" fill="#051C2C"></rect><text x="120" y="127" font-family="Georgia, Songti SC, STSong, serif" font-size="34" font-weight="600" fill="#FFFFFF" dominant-baseline="alphabetic">六组关键事实，按证据强度排序</text><g data-audit-rect="96,192,1088,428"><g data-audit-box="96,229.24,1088"><g transform="translate(96,229.24)"><g><line x1="1" y1="4" x2="1" y2="139" stroke="#FFC72C" stroke-width="2" opacity="0.65"></line><text x="22" y="34" font-size="34" font-weight="bold" font-style="italic" fill="#0A0E14" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">01</text><text x="22" y="66" font-size="18" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">量：单量升、金额降，指向以价换量</text><text x="22" y="96" font-size="13" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">单量 +近两成（另有 +18.6%/+25% 口径），二手金额约</text><text x="22" y="114" font-size="13" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">-15.6%，不同口径不可交叉相乘。</text><text x="22" y="136" font-size="12.5" fill="#6B6B6B" opacity="1" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">财新/exmoo/人民网 08-22 · 公开可核实</text></g><g><line x1="373" y1="4" x2="373" y2="139" stroke="#FFC72C" stroke-width="2" opacity="0.65"></line><text x="394" y="34" font-size="34" font-weight="bold" font-style="italic" fill="#0A0E14" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">02</text><text x="394" y="66" font-size="18" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">利：抬升远超单量增速</text><text x="394" y="97" font-size="14" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">利润率 14.6%、上半年净利 38.79</text><text x="394" y="116" font-size="14" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">亿元、利润近翻倍（含显著低基数）。</text><text x="394" y="138" font-size="12.5" fill="#6B6B6B" opacity="1" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">搜狐/智通财经/新京报 08-22 · TIKR 08-23</text></g><g><line x1="745" y1="4" x2="745" y2="139" stroke="#FFC72C" stroke-width="2" opacity="0.65"></line><text x="766" y="34" font-size="34" font-weight="bold" font-style="italic" fill="#0A0E14" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">03</text><text x="766" y="66" font-size="18" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">人：不扩张，含供给出清的 β</text><text x="766" y="89" font-size="8" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">2021 年以来行业经纪人深度流失，分母收缩抬高人均；Y</text><text x="766" y="100" font-size="8" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">边界条件：出清解释「人少」，解释不了「量涨而人不增」，剪刀差主体记 α 候选池。</text><text x="766" y="122" font-size="12.5" fill="#6B6B6B" opacity="1" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">财新 08-22 · 公开可核实</text></g><g><line x1="1" y1="187" x2="1" y2="322" stroke="#FFC72C" stroke-width="2" opacity="0.65"></line><text x="22" y="217" font-size="34" font-weight="bold" font-style="italic" fill="#0A0E14" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">04</text><text x="22" y="249" font-size="18" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">效：均值 +87%，主要是尾部修复</text><text x="22" y="275" font-size="10" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">人效 3→5.6 单、零开单率 25%→&lt;10%；「0 变 1」而非「3 变 6」；Y</text><text x="22" y="289" font-size="10" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">提示：压到十分之一以下超出自然出清幅度，是机制性力量旁证。</text><text x="22" y="311" font-size="12.5" fill="#6B6B6B" opacity="1" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">管理层 S 分享 08-21 · 内部单源 · Y 提示</text></g><g><line x1="373" y1="187" x2="373" y2="322" stroke="#FFC72C" stroke-width="2" opacity="0.65"></line><text x="394" y="217" font-size="34" font-weight="bold" font-style="italic" fill="#0A0E14" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">05</text><text x="394" y="249" font-size="18" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">获客：转带看率 +48%，试点规模</text><text x="394" y="275" font-size="10" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">5 万+ 线索、7.4% vs 5%（相对高约 50%）；Y 解读：AI</text><text x="394" y="289" font-size="10" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">信息平权后渠道价值转向决策服务，渠道产能重定价；不改变证据等级。</text><text x="394" y="311" font-size="12.5" fill="#6B6B6B" opacity="1" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">管理层 S 分享 08-21 · 内部单源 · Y 解读</text></g><g><line x1="745" y1="187" x2="745" y2="322" stroke="#FFC72C" stroke-width="2" opacity="0.65"></line><text x="766" y="217" font-size="34" font-weight="bold" font-style="italic" fill="#0A0E14" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">06</text><text x="766" y="249" font-size="18" font-weight="bold" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">外部：确认性与叙事信息</text><text x="766" y="280" font-size="14" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">长江证券「效率持续兑现」、大摩上调目标价、彭永</text><text x="766" y="299" font-size="14" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">东业绩会表态，不构成独立事实增量。</text><text x="766" y="321" font-size="12.5" fill="#6B6B6B" opacity="1" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">08-25/08-24/08-22 · 外部确认</text></g></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">证据强度排序：公开可核实 &gt; 内部单源（未获独立交叉验证）&gt; 外部确认（叙事信息）。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 98wiki ｜ 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v2.1 · 2026-08</text></svg>