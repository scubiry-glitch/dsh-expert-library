<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="banner-heading"><rect x="96" y="72" width="1088" height="88" rx="2" fill="#051C2C"></rect><text x="120" y="127" font-family="Georgia, Songti SC, STSong, serif" font-size="34" font-weight="600" fill="#FFFFFF" dominant-baseline="alphabetic">展望与风险：范式判断与误读警示</text><g data-audit-rect="96,192,1088,428"><g data-audit-box="96,192,1088"><g transform="translate(96,192)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">范式判断（研判推断）：若多城验证，行业增长模式切换为人效扩张</text><text x="0" y="68" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">成本函数从「人海规模」转向「组织资本」，估值从周期股切向效率股</text><text x="0" y="110" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">行业注脚（Y）：从业者价值从「跑盘抢客」转向「经营能力」，渠道靠密度取胜</text><text x="0" y="152" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">乐观情形：D 判断未采纳为主基调，证据全为内部单源</text><text x="0" y="194" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">若差分通过且 AI 成本收敛：中枢 10-12% → 13-15%（研判推断）</text></g></g><g data-audit-box="96,460,1088"><g transform="translate(96,460)"><rect x="0" y="0" width="1088" height="69" rx="2" fill="#DC2626"></rect><rect x="0" y="3" width="1088" height="66" rx="2" fill="#FFFFFF"></rect><g transform="translate(14,26) scale(0.8333333333333334)"><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 9v4"></path><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 17h.01"></path></g><text x="44" y="43" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">误读警示：把单季利润翻倍外推全年、把内部单源样本人效当平台整体水平，是双重误读。</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">六项不确定性：试点盘优选偏差、口径混用、AI 成本与同店口径未披露、政策脉冲 β 持续性、差分跨旺季污染、对照组污染与跨能级配对（Y）。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 98wiki ｜ 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v2.1 · 2026-08</text></svg>