<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="stacked-poster"><line x1="56" y1="80" x2="1224" y2="80" stroke="#D5D5CB" stroke-width="1.6"></line><text x="56" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="50" font-weight="500" fill="#051C2C" dominant-baseline="alphabetic">验证协议：6 城 90 天差分，唯一裁决点</text><g data-audit-rect="56,180,1168,420"><g data-audit-box="56,180,1168"><g transform="translate(56,180)" data-audit-box="56,180,1168" data-audit-rect="56,180,1168,104"><line x1="64" y1="2" x2="1168" y2="2" stroke="#D5D5CB" stroke-width="1"></line><rect x="0" y="0" width="64" height="4" fill="#D9822B"></rect><g transform="translate(0,26) scale(0.9166666666666666)"><path stroke="#D9822B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381"></path><path stroke="#D9822B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m16 16 6-6"></path><path stroke="#D9822B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21.5 10.5-8-8"></path><path stroke="#D9822B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m8 8 6-6"></path><path stroke="#D9822B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m8.5 7.5 8 8"></path></g><text x="38" y="46" font-family="Georgia, Songti SC, STSong, serif" font-size="26" font-weight="600" fill="#051C2C" dominant-baseline="alphabetic">6 城 90 天差分：3 城上线盘级经营 + Skill、3 城对照；控制市场成交增速后，人效净提升不足</text><text x="38" y="80" font-family="Georgia, Songti SC, STSong, serif" font-size="26" font-weight="600" fill="#051C2C" dominant-baseline="alphabetic">10% 或贡献利润不升，即撤回组织 α 判断。</text></g></g><g data-audit-box="56,324,1168"><g transform="translate(56,324)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">按能级配对：北京/上海/成都 vs 武汉/西安/郑州，不得跨能级（Y）</text><text x="0" y="68" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">对照组同口径监测零开单率与人效，防霍桑效应；判定用同店 GTV/人</text><text x="0" y="110" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">对照组污染：跨城借调、人员流动稀释差分，须显式排除（Y）</text><text x="0" y="152" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">证伪条件不变：净人效 &lt;10% 或贡献利润不升即撤回 α</text></g></g></g><text x="56" y="688" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#6B6B6B" letter-spacing="4" font-style="italic" dominant-baseline="alphabetic">验证窗口：约 2026Q4 出结果；全部研判（T/D/W/X · 张一鸣/马斯克 · 杨现领）一致认可的唯一裁决点。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 98wiki ｜ 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v2.1 · 2026-08</text></svg>