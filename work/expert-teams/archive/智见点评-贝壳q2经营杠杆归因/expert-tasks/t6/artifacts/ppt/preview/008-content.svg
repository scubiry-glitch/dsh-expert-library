<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><path d="M 0,720 L 0,460 A 260,260 0 0,1 260,720 Z" fill="#051C2C" opacity="0.06"></path></g><g data-archetype="side-highlight"><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="42" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">三个验证节点</text><g data-audit-rect="96,190,880,426"><g data-audit-box="96,273.6,880"><g transform="translate(96,273.6)"><line x1="20" y1="100" x2="860" y2="100" stroke="#D5D5CB" stroke-width="2"></line><g><circle cx="20" cy="100" r="8" fill="#051C2C"></circle><text x="12" y="76" text-anchor="start" fill="#0A0E14" font-size="16" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">2026Q3</text><text x="12" y="128" text-anchor="start" fill="#051C2C" font-size="16" font-weight="bold" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Q3 财报 · 压力测试</text><text x="12" y="150" text-anchor="start" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">成交回落假设下利润率能否站住；β 退潮后「α 是否还在」即见分晓。</text></g><g><circle cx="440" cy="100" r="8" fill="#051C2C"></circle><text x="440" y="76" text-anchor="middle" fill="#0A0E14" font-size="16" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">约 2026Q4</text><text x="440" y="128" text-anchor="middle" fill="#051C2C" font-size="16" font-weight="bold" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">6 城 90 天差分</text><text x="440" y="150" text-anchor="middle" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">按能级配对（北京/上海/成都 vs 武汉/西安/郑州），判定用同店</text><text x="440" y="167" text-anchor="middle" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">GTV/人；差分期内同步观测挂牌量与成交周期作 β 旁证。</text></g><g><circle cx="860" cy="100" r="8" fill="#051C2C"></circle><text x="868" y="76" text-anchor="end" fill="#0A0E14" font-size="16" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">持续跟踪</text><text x="868" y="128" text-anchor="end" fill="#051C2C" font-size="16" font-weight="bold" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">AI 成本披露</text><text x="868" y="150" text-anchor="end" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">调用成本/单是否随量收敛；三关皆过则经营杠杆叙事成立，第一关即</text><text x="868" y="167" text-anchor="end" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">破则利润翻倍归类为 β 行情（研判推断）。</text></g></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">Q3 财报为第一关压力测试；对照组污染与跨能级配对为差分实验隐性风险，须显式排除（居住服务·Y）。</text><rect x="1008" y="72" width="176" height="568" rx="12" fill="#051C2C"></rect><text x="1032" y="116" font-family="Georgia, Songti SC, STSong, serif" font-size="13" font-weight="700" letter-spacing="1" fill="#FFFFFF" opacity="0.85" dominant-baseline="alphabetic">1.7</text><text x="1096" y="356" text-anchor="middle" font-family="Georgia, Songti SC, STSong, serif" font-size="128" font-weight="800" fill="#FFFFFF" opacity="0.18" dominant-baseline="alphabetic">01</text><rect x="1032" y="564" width="28" height="3" fill="#FFFFFF" opacity="0.4"></rect><text x="1032" y="600" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#FFFFFF" opacity="0.85" dominant-baseline="alphabetic">98wiki ｜ 智见点评</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 98wiki ｜ 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v2.1 · 2026-08</text></svg>