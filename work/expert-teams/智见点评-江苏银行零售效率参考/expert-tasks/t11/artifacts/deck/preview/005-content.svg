<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><rect x="1216" y="44" width="10" height="10" fill="#051C2C" opacity="0.85"></rect></g><g data-archetype="image-lead-split"><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="38" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">线1 人效重构：客户经理管户重配（现在干）</text><g data-audit-rect="96,190,788,426"><g data-audit-box="96,190,788"><g transform="translate(96,190)"><rect x="0" y="0" width="788" height="119" rx="2" fill="#051C2C"></rect><rect x="0" y="3" width="788" height="116" rx="2" fill="#FFFFFF"></rect><g transform="translate(14,51) scale(0.8333333333333334)"><path stroke="#051C2C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path stroke="#051C2C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 12 2 2 4-4"></path></g><text x="44" y="39" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">验收口径（袁军裁定）：同店管户 AUM/人 净增（控 β</text><text x="44" y="67" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">差分，陶琦口径：锁定存量管户池、剔除新分配与离职交接），不是规模排名；同</text><text x="44" y="95" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">店 AUM/人 只作观测指标不作考核指标。</text></g></g><g data-audit-box="96,325,788"><g transform="translate(96,325)"><text x="0" y="22" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">迁移逻辑：「0 变 1」尾部修复——β 能改分母，改不了「零产单变产一单」</tspan></text><text x="0" y="58" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">执行 SOP：划片管户、人客重配——尾部零产单管户收归头部 + AI 辅助承接</tspan></text><text x="0" y="94" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">P25 判据（陶琦）：尾部产出占比超 50%</tspan></text><text x="0" y="122" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">属存量激活式修复、天花板低；头部跃迁才是真 α，分开记账</text><text x="0" y="158" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">考核双层（高增银）：分行层 = 同店口径净人效差分核销 α</tspan></text><text x="0" y="194" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">个人层 = 行为（管户覆盖、回访频次）+ 结果（单客 FTP 后净贡献）双因子</tspan></text><text x="0" y="230" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">零产单率月度通报、不挂钩绩效工资（防尾部客户经理冲量造假）</tspan></text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">贝壳参考：人效约 3 单→5.6 单（+87%）、零开单率近 25%→不足 10%（管理层 S 分享 08-21，内部单源）。</text><g data-audit-rect="924,72,260,568"><rect x="924" y="72" width="260" height="568" rx="20" fill="#FFFFFF"></rect><rect x="924.5" y="72.5" width="259" height="567" rx="20" fill="none" stroke="#D5D5CB" stroke-width="1"></rect><circle cx="1054" cy="356" r="57.2" fill="#051C2C" fill-opacity="0.1"></circle><rect x="1022" y="441.2" width="64" height="4" rx="2" fill="#FFC72C"></rect></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v3（三轮质询已并入） · 2026-08-25</text></svg>