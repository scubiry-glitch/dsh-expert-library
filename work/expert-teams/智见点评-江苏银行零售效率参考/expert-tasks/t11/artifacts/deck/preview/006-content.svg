<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><rect x="1216" y="44" width="10" height="10" fill="#051C2C" opacity="0.85"></rect></g><g data-archetype="asymmetric-triptych"><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="42" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">线2 AI 规模化：人工基线 + 两档验证（试点）</text><line x1="744" y1="186" x2="744" y2="616" stroke="#D5D5CB" stroke-width="1" stroke-opacity="0.6"></line><rect x="760" y="186" width="424" height="430" rx="6" fill="none" stroke="#D5D5CB" stroke-opacity="0.45" stroke-width="1"></rect><g data-audit-rect="96,186,632,430"><g data-audit-box="96,261.62,632"><g transform="translate(96,261.62)"><rect x="0" y="0" width="632" height="231" rx="2" fill="#DC2626"></rect><rect x="0" y="3" width="632" height="228" rx="2" fill="#FFFFFF"></rect><g transform="translate(14,107) scale(0.8333333333333334)"><circle stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="12" r="10"></circle><circle stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="12" r="6"></circle><circle stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="12" r="2"></circle></g><text x="44" y="39" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">证伪条件（高增银 / 王一帆 / 梁斌合并口径）：AI</text><text x="44" y="67" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">承接商机转化率 ≥ 人工基线 且 单位获客成本不升（6</text><text x="44" y="95" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">个月验证，T+180 无证据即撤）；人工基线 = 试点分行试点前 6</text><text x="44" y="123" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">个月同渠道人工转化率（差分前测，非全行均值）；「AI</text><text x="44" y="151" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">承接」分 AI 辅助（人机协同）/ AI</text><text x="44" y="179" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">自主（无人工干预）两档分别验证；「12 个月进件占比</text><text x="44" y="207" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#051C2C" dominant-baseline="alphabetic">30%」降为监测指标，口径统一到「获批且放款」。</text></g></g></g><g data-audit-rect="760,186,424,430"><g data-audit-box="760,202.34,424"><g transform="translate(760,202.34)"><text x="0" y="19" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">物理上限（马斯克）：六成环节可结构化、四成成本不</tspan></text><text x="0" y="43" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic">可结构化——净降本 20-30% 到头，不是 10 倍</text><text x="0" y="75" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">技术路径（梁斌）：流程分段嵌入——先做进件完整性</tspan></text><text x="0" y="99" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic">校验、反欺诈初筛、规则审核</text><text x="0" y="131" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">风险定价与终审人工兜底；人工审批经验沉淀至大模型</tspan></text><text x="0" y="155" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic">做辅助决策</text><text x="0" y="187" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">数据治理前置（梁斌）：口径字典与单一取数源由总行</tspan></text><text x="0" y="211" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic">数据中台统一发布，禁止分行自报表</text><text x="0" y="243" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">责任主体 = 总行数据管理部而非零售部</tspan></text><text x="0" y="275" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">成本 BOM 入账：AI 线索转介成本/单、调用成本/单</tspan></text><text x="0" y="307" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">算力挂总行科技账时，「效率提升」是账面幻觉</tspan></text><text x="0" y="339" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">自主可控底线（王一帆）：规则、模型、决策自建；外</tspan></text><text x="0" y="363" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#051C2C" dominant-baseline="alphabetic">部平台当工具不当大脑</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">进件 ≠ 获批 ≠ 放款：转化链定义到「放款且首笔动账」（高增银裁定）。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">讨论稿 v3（三轮质询已并入） · 2026-08-25</text></svg>