 stroke="#051C2C" stroke-width="2"></line><line x1="0" y1="88" x2="1168" y2="88" stroke="#D5D5CB" stroke-width="1"></line><line x1="0" y1="132" x2="1168" y2="132" stroke="#D5D5CB" stroke-width="1"></line><line x1="0" y1="176" x2="1168" y2="176" stroke="#D5D5CB" stroke-width="1"></line><line x1="0" y1="220" x2="1168" y2="220" stroke="#D5D5CB" stroke-width="1"></line><text x="12" y="72" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="bold" dominant-baseline="alphabetic">进件</text><text x="92" y="72" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">面签 15-20 分钟拖累团办；支用率 1.6%</text><text x="515.2565055762082" y="72" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">AI 校验+反欺诈；白名单预授信</text><text x="894.2602230483271" y="72" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">面签 -50%；支用率→3.2%</text><text x="12" y="116" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="bold" dominant-baseline="alphabetic">审批</text><text x="92" y="116" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">定价不灵活、无白名单；手动领券</text><text x="515.2565055762082" y="116" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">AI 审批辅助；按月主动发券</text><text x="894.2602230483271" y="116" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">支用率 5.39%→6.2%</text><text x="12" y="160" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="bold" dominant-baseline="alphabetic">放款</text><text x="92" y="160" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">无先息后本易被置换；长支 55.38%</text><text x="515.2565055762082" y="160" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">AB 类试点长期限（苏锡通 3 个月）</text><text x="894.2602230483271" y="160" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">长支→65%+；续贷率 60-80%</text><text x="12" y="204" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="bold" dominant-baseline="alphabetic">用信</text><text x="92" y="204" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">用信转化是洞（≈12%/≈10%）</text><text x="515.2565055762082" y="204" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">分层管户+尾部唤醒；一客两品</text><text x="894.2602230483271" y="204" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">每提 1pct 增量以亿计</text></g></g></g><text x="56" y="688" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#6B6B6B" letter-spacing="4" font-style="italic" dominant-baseline="alphabetic">出处：08-21 内部单源 · 98wiki #203 · 99wiki 06-25 / 07-23。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">运营版 v2（可落地版 · 三轮质询已并入） · 2026-08-25</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 智见点评</text></svg>