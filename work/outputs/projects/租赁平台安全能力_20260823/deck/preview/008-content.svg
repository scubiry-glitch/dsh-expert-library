<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="stacked-poster"><line x1="56" y1="80" x2="1224" y2="80" stroke="#D5D5CB" stroke-width="1.6"></line><text x="56" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="50" font-weight="500" fill="#051C2C" dominant-baseline="alphabetic">归因二：投入强度公式</text><g data-audit-rect="56,180,1168,460"><g data-audit-box="56,180,1168"><g transform="translate(56,180)" data-audit-box="56,180,1168" data-audit-rect="56,180,1168,72"><line x1="64" y1="2" x2="1168" y2="2" stroke="#D5D5CB" stroke-width="1"></line><rect x="0" y="0" width="64" height="4" fill="#6B6B6B"></rect><g transform="translate(0,27) scale(0.9166666666666666)"><path stroke="#6B6B6B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 7V5a1 1 0 0 0-1-1H6.5a.5.5 0 0 0-.4.8l4.5 6a2 2 0 0 1 0 2.4l-4.5 6a.5.5 0 0 0 .4.8H17a1 1 0 0 0 1-1v-2"></path></g><text x="38" y="48" font-family="Georgia, Songti SC, STSong, serif" font-size="28" font-weight="600" fill="#051C2C" dominant-baseline="alphabetic">平台投入强度 = 整改可闭环度 × 监管压力 × 溢价可生成性</text></g></g><g data-audit-box="56,268,1168"><g transform="translate(56,268)"><text x="0" y="35" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">燃气三项全高：可单套闭环、爆燃监管倒逼、可交付「安心租」溢价</text><text x="0" y="88" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">电气三项全低：单套无解、监管压力小、无法证明交付</text><text x="0" y="141" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">偏科不是态度问题，是结构问题</text></g></g><g data-audit-box="56,470,1168"><g transform="translate(56,470)"><rect x="0" y="0" width="1168" height="125" rx="2" fill="#051C2C"></rect><rect x="0" y="3" width="1168" height="122" rx="2" fill="#FFFFFF"></rect><g transform="translate(14,54) scale(0.8333333333333334)"><circle stroke="#051C2C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="12" r="10"></circle><path stroke="#051C2C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4"></path><path stroke="#051C2C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 8h.01"></path></g><text x="44" y="51" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">责任边界成为核心矛盾的根源：义务与能力错配——维修义务法定在产权人，</text><text x="44" y="96" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">产权人不居住不巡检；平台有触达能力却无法定义务。</text></g></g></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">1.0 · 2026-08-23</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Public · 98wiki ｜ 智见</text></svg>