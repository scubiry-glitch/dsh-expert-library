 serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">十万套月度巡检占比</text><text x="476" y="72" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">↑</text></g><g><text x="12" y="115" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="14" font-weight="normal" dominant-baseline="alphabetic">发现率（每万套风险）</text><text x="181.15785636164782" y="116" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">12.7 基线（企业披露口径）</text><text x="476" y="116" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">↓</text></g><g><text x="12" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">7日整改闭环率</text><text x="181.15785636164782" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">燃气 ≥90%，电气单列（建议值）</text><text x="476" y="160" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">≥90%</text></g><g><text x="12" y="204" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">重复风险率</text><text x="181.15785636164782" y="204" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic">同一房源复发</text><text x="476" y="204" text-anchor="start" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="16" font-weight="normal" dominant-baseline="alphabetic