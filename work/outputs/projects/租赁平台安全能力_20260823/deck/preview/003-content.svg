eight="normal" dominant-baseline="alphabetic">—</text><text x="503.4952748885587" y="70" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">—</text><text x="12" y="114" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="bold" dominant-baseline="alphabetic">风险告知与披露</text><text x="150.57949479940564" y="114" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">承担</text><text x="364.91578008915303" y="114" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">—</text><text x="503.4952748885587" y="114" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">—</text><text x="12" y="158" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="bold" dominant-baseline="alphabetic">整改督促与停租下架</text><text x="150.57949479940564" y="158" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">承担（停租阈值=责任分洪闸）</text><text x="364.91578008915303" y="158" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">拒不整改者责任移转</text><text x="503.4952748885587" y="158" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">—</text><text x="12" y="202" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="bold" dominant-baseline="alphabetic">房屋本体维修改造</text><text x="150.57949479940564" y="202" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">不承担</text><text x="364.91578008915303" y="202" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">法定无限义务</text><text x="503.4952748885587" y="202" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">—</text><text x="12" y="246" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="bold" dominant-baseline="alphabetic">事故赔付</text><text x="150.57949479940564" y="246" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">过错归因：漏检/未告知/未下架</text><text x="364.91578008915303" y="246" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">拒不整改后出租</text><text x="503.4952748885587" y="246" fill="#051C2C" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="normal" dominant-baseline="alphabetic">不可抗力/使用不当</text></g></g></g><g data-audit-rect="733.76,186,450.24,454"><g data-audit-box="733.76,259.72,450.24"><g transform="translate(733.76,259.72)"><rect x="0" y="0" width="450.24" height="260" rx="2" fill="#DC2626"></rect><rect x="0" y="3" width="450.24" height="257" rx="2" fill="#FFFFFF"></rect><g transform="translate(14,121.5) scale(0.8333333333333334)"><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 9v4"></path><path stroke="#DC2626" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 17h.01"></path></g><text x="44" y="51" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">平台不做责任的终点：责任</text><text x="44" y="96" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">以证据链为界、不以金额为</text><text x="44" y="141" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">界——巡检记录、风险告知</text><text x="44" y="186" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">单、整改SLA、下架凭证，</text><text x="44" y="231" font-family="Georgia, Songti SC, STSong, serif" font-size="32" fill="#051C2C" dominant-baseline="alphabetic">谁在证据链上失守谁担责。</text></g></g></g></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">1.0 · 2026-08-23</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Public · 98wiki ｜ 智见</text></svg>