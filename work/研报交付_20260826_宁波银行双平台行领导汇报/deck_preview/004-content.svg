<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><rect x="1216" y="44" width="10" height="10" fill="#051C2C" opacity="0.85"></rect></g><g data-archetype="banner-heading"><text x="96" y="52" font-family="Georgia, Songti SC, STSong, serif" font-size="12" fill="#6B6B6B" letter-spacing="4" dominant-baseline="alphabetic">核心观点</text><rect x="96" y="72" width="1088" height="88" rx="2" fill="#051C2C"></rect><text x="120" y="127" font-family="Georgia, Songti SC, STSong, serif" font-size="34" font-weight="600" fill="#FFFFFF" dominant-baseline="alphabetic">五个基本判断</text><g data-audit-rect="96,192,1088,428"><g data-audit-box="96,192,1088"><g transform="translate(96,192)" data-audit-box="96,192,1088" data-audit-rect="96,192,1088,104"><line x1="64" y1="2" x2="1088" y2="2" stroke="#D5D5CB" stroke-width="1"></line><rect x="0" y="0" width="64" height="4" fill="#2E9E6B"></rect><text x="0" y="46" font-family="Georgia, Songti SC, STSong, serif" font-size="26" font-weight="600" fill="#051C2C" dominant-baseline="alphabetic">方向正确、路径可行、窗口期紧迫——以「一套底座、两条主线、三个闭环、90天试点」启动</text><text x="0" y="80" font-family="Georgia, Songti SC, STSong, serif" font-size="26" font-weight="600" fill="#051C2C" dominant-baseline="alphabetic">，用业务沉淀说话。</text></g></g><g data-audit-box="96,336,1088"><g transform="translate(96,336)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">财务已验证逻辑：两项收入增速18.2%（高出我行约7pct），中收+53.9%、代理类收入49.9亿占中收</text><text x="0" y="60" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">85%</text><text x="0" y="102" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">三低时代，平台是负债端胜负手：存款成本率1.32%（降39bp）、活期占比35.57%</text><text x="0" y="144" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">差距在结构不在规模：私行AUM占比13.9% vs 29.4%；对公理财658亿 vs 2000亿+</text><text x="0" y="186" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">我行禀赋不差，缺的是组织机制：苏银生活月活800万（年底目标1000万）</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">数据均为2026H1口径（#256）；行内对照为聚合口径。严守三条底线：不突破风险底线换业绩、不层层加码、不把平台做成摆设。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 江苏银行（智见点评·行业研究报告）</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">正式稿 · 2026-08</text></svg>