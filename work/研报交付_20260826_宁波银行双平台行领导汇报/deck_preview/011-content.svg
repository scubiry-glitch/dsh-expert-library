c">对标波波知了：出海、节能、AI赋能、资源对接 · 聚焦江苏制造/科技/外贸企业</text></g><g><rect x="0" y="0" width="632" height="72" rx="2" fill="#FFFFFF"></rect><text x="16" y="42" font-size="15" font-weight="bold" font-family="Georgia, Songti SC, STSong, serif" fill="#051C2C" dominant-baseline="alphabetic">主线二·组织员工服务线</text><text x="180" y="44" font-size="11" font-family="Georgia, Songti SC, STSong, serif" fill="#051C2C" dominant-baseline="alphabetic">对标数字人力：HR、代发、五险一金、报销、撮合 · 「只撮合不交付」边界先行试点</text></g></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">总体架构（已定稿）：一套底座＋两条主线＋三个金融闭环＋90天双场景试点；渠道「一重两轻」，统一智能派单，防止渠道割裂退化为孤岛App。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 江苏银行（智见点评·行业研究报告）</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">正式稿 · 2026-08</text></svg>