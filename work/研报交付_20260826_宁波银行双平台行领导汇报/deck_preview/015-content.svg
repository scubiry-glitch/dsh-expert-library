<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="asymmetric-triptych"><text x="96" y="96" font-family="Georgia, Songti SC, STSong, serif" font-size="12" fill="#6B6B6B" letter-spacing="4" dominant-baseline="alphabetic">90天试点与组织保障</text><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="42" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">验收口径与组织考核</text><line x1="744" y1="186" x2="744" y2="616" stroke="#D5D5CB" stroke-width="1" stroke-opacity="0.6"></line><rect x="760" y="186" width="424" height="203" rx="6" fill="none" stroke="#D5D5CB" stroke-opacity="0.45" stroke-width="1"></rect><rect x="760" y="413" width="424" height="203" rx="6" fill="none" stroke="#D5D5CB" stroke-opacity="0.45" stroke-width="1"></rect><line x1="760" y1="401" x2="1184" y2="401" stroke="#D5D5CB" stroke-width="1" stroke-opacity="0.3"></line><g data-audit-rect="96,186,632,430"><g data-audit-box="96,186,632"><g transform="translate(96,186)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">验收以业务沉淀为准：代发签约与留存、对公理财/私行转</text><text x="0" y="60" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">化、活期沉淀、中收贡献（非注册数）</text><text x="0" y="102" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">过程观察指标（测算建议值）：代发90天留存≥85%、绑卡率</text><text x="0" y="136" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">≥30%、权益核销≥15%、获客成本降30%+、NPS≥40</text><text x="0" y="178" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">组织：项目制独立运作，产品/运营/技术/合规四线合署；</text><text x="0" y="212" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">明确「非金融运营主体」合规身份</text><text x="0" y="254" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">试点期薪酬按市场50-70%区间起步、绑定里程碑考核（测算</text><text x="0" y="288" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">建议值）</text><text x="0" y="330" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">考核：转向业务沉淀，与分行业绩双算；平台允许短期不盈</text><text x="0" y="364" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">利</text><text x="0" y="406" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">严禁把提质曲解为层层加码、只看短期规模排名</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">以上目标均为测算建议值（研判推断），立项时按实际资源校准。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 江苏银行（智见点评·行业研究报告）</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">正式稿 · 2026-08</text></svg>