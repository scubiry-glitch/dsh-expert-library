<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><path d="M 0,720 L 0,460 A 260,260 0 0,1 260,720 Z" fill="#051C2C" opacity="0.06"></path></g><g data-archetype="image-lead-split"><text x="96" y="96" font-family="Georgia, Songti SC, STSong, serif" font-size="17" fill="#6B6B6B" letter-spacing="2" dominant-baseline="alphabetic">90天试点与组织保障</text><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="38" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">风险与合规红线</text><g data-audit-rect="96,190,788,426"><g data-audit-box="96,197.6,788"><g transform="translate(96,197.6)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">考核周期匹配投入：培育期≥18个月；转化率显著低于测算值时，节奏下修</text><text x="0" y="60" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">为半年一评</text><text x="0" y="102" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">数据治理滞后将导致AI「无米下锅」——数据治理是AI上线的前提</text><text x="0" y="144" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">渠道割裂是最大执行风险：统一线索流转与智能派单前置防控</text><text x="0" y="186" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">合规红线：服务不捆绑信贷、不承诺收益、严禁变相吸储；信息采集最小</text><text x="0" y="220" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">必要、用途限定</text><text x="0" y="262" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">服务商准入与消保审查会签；代发结算落实反洗钱监测；宣传不使用「客</text><text x="0" y="296" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">户分层」口径</text><text x="0" y="338" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">「数字人力」公开形态与新平台是否等同待核实；若确认合规瑕疵，组织</text><text x="0" y="372" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">侧上线推迟</text></g></g></g><text x="96" y="648" font-family="Georgia, Songti SC, STSong, serif" font-size="14" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">风险提示均为边界条件：三条底线是不突破风险底线换业绩、不层层加码、不把平台做成摆设。</text><g data-audit-rect="924,72,260,568"><rect x="924" y="72" width="260" height="568" rx="20" fill="#FFFFFF"></rect><rect x="924.5" y="72.5" width="259" height="567" rx="20" fill="none" stroke="#D5D5CB" stroke-width="1"></rect><circle cx="1054" cy="356" r="57.2" fill="#051C2C" fill-opacity="0.1"></circle><rect x="1022" y="441.2" width="64" height="4" rx="2" fill="#FFC72C"></rect></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 江苏银行（智见点评·行业研究报告）</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">正式稿 · 2026-08</text></svg>