<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><rect x="1216" y="44" width="10" height="10" fill="#051C2C" opacity="0.85"></rect></g><g data-archetype="bento-panel"><text x="96" y="104" font-family="Georgia, Songti SC, STSong, serif" font-size="12" fill="#6B6B6B" letter-spacing="4" dominant-baseline="alphabetic">90天试点与组织保障</text><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="44" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">提请决策事项</text><g data-audit-rect="96,186,1088,454"><g data-audit-box="96,271.88,1088"><g transform="translate(96,271.88)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">批准设立专项项目组（项目制独立运作），核定首期预算500-800万元（测算建议值）</tspan></text><text x="0" y="68" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">批准90天试点方案与量化目标（30家签约/20家代发/3000万元月代发额/40%渗透率/1亿元沉淀）</tspan></text><text x="0" y="110" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">批准「业务沉淀」导向考核办法与分行双算机制，明确试点期容错边界</tspan></text><text x="0" y="152" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">授权与量子教育等服务商谈判（入驻、权益分成、数据边界），提交合规与消保审查</tspan></text><text x="0" y="194" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic"><tspan fill="#051C2C">☐ </tspan><tspan fill="#051C2C">要求法务合规部出具平台与金融业务边界、个人信息保护专项意见，核实「数字人力」与新平台关系</tspan></text></g></g></g></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><tex