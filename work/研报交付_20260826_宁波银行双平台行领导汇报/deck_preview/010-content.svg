<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"><path d="M 0,720 L 0,460 A 260,260 0 0,1 260,720 Z" fill="#051C2C" opacity="0.06"></path></g><g data-archetype="bento-panel"><text x="96" y="104" font-family="Georgia, Songti SC, STSong, serif" font-size="12" fill="#6B6B6B" letter-spacing="4" dominant-baseline="alphabetic">我行启示与建议方案</text><text x="96" y="150" font-family="Georgia, Songti SC, STSong, serif" font-size="44" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">学宁波，学三件事</text><g data-audit-rect="96,186,1088,454"><g data-audit-box="96,236.16,1088"><g transform="translate(96,236.16)"><text x="0" y="26" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">客户观：从分层经营转向任务链经营（严禁「客户分层」表述），同一客户可同时接入经营、组织两条</text><text x="0" y="60" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">链</text><text x="0" y="102" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">产品观：从产品推销转向价值先行——苏银生活800万月活若只用来发权益、卖产品，就仍是资金中介</text><text x="0" y="136" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">打法</text><text x="0" y="178" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">获客观：从单点获客转向生态获客——把消费贷团办、信用卡课程权益、私行C9联培等散点串成平台体</text><text x="0" y="212" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">系</text><text x="0" y="254" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">机制观：政银协同制度化——江苏制造业园区禀赋优于宁波，把「领导拜访式协同」升级为「机制化平</text><text x="0" y="288" font-family="Georgia, Songti SC, STSong, serif" font-size="24" fill="#051C2C" dominant-baseline="alphabetic">台化协同」</text></g></g></g><text x="96" y="652" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">学宁波，学的不是两个App，而是三件事：任务链经营的客户观、先价值后业务的产品观、独立运营与政银协同的机制观。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 江苏银行（智见点评·行业研究报告）</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">正式稿 · 2026-08</text></svg>