<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"></rect><g data-decor="true"></g><g data-archetype="tone-adaptive-content"><text x="64" y="62" font-family="Georgia, Songti SC, STSong, serif" font-size="22" fill="#0A0E14" letter-spacing="2" dominant-baseline="alphabetic">Chapter 04 · 90天试点与组织保障</text><text x="64" y="130" font-family="Georgia, Songti SC, STSong, serif" font-size="46" font-weight="700" fill="#051C2C" dominant-baseline="alphabetic">90天双场景试点</text><line x1="64" y1="162" x2="112" y2="162" stroke="#FFC72C" stroke-width="4"></line><line x1="112" y1="162" x2="1216" y2="162" stroke="#D5D5CB" stroke-width="1.6"></line><g data-audit-rect="64,180,1152,420"><g data-audit-box="64,267.78,1152"><g transform="translate(64,267.78)"><line x1="20" y1="100" x2="1132" y2="100" stroke="#D5D5CB" stroke-width="2"></line><g><circle cx="20" cy="100" r="8" fill="#051C2C"></circle><text x="12" y="76" text-anchor="start" fill="#0A0E14" font-size="16" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">第1-30天·搭台</text><text x="12" y="128" text-anchor="start" fill="#051C2C" font-size="16" font-weight="bold" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">底座MVP上线</text><text x="12" y="150" text-anchor="start" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">签约试点企业≥30家；服务商入驻≥10家；完成准入与合规审查</text></g><g><circle cx="576" cy="100" r="8" fill="#051C2C"></circle><text x="576" y="76" text-anchor="middle" fill="#0A0E14" font-size="16" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">第31-60天·跑通</text><text x="576" y="128" text-anchor="middle" fill="#051C2C" font-size="16" font-weight="bold" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">两条主线各跑通1个完整转化案例</text><text x="576" y="150" text-anchor="middle" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">签约代发≥20家、新增代发≥3000人、沉淀代发月额≥3000万元；导流页面上线</text></g><g><circle cx="1132" cy="100" r="8" fill="#051C2C"></circle><text x="1140" y="76" text-anchor="end" fill="#0A0E14" font-size="16" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">第61-90天·验证</text><text x="1140" y="128" text-anchor="end" fill="#051C2C" font-size="16" font-weight="bold" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">形成《双平台试点验证报告》</text><text x="1140" y="150" text-anchor="end" fill="#6B6B6B" font-size="13" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">渗透率≥40%、沉淀对公存款≥1亿元、私行线索≥50条、圈层活动≥2场</text></g></g></g></g><text x="64" y="688" font-family="Georgia, Songti SC, STSong, serif" font-size="20" fill="#6B6B6B" font-style="italic" dominant-baseline="alphabetic">场景A＝制造型培训代发闭环（组织侧）；场景B＝科技/外贸AI出海闭环（经营侧，南京或苏州园区联动）。目标均为测算建议值，立项时校准。</text></g><line x1="56" y1="664" x2="1224" y2="664" stroke="#D5D5CB" stroke-width="1.2"></line><text x="56" y="700" font-size="20" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">Internal · 江苏银行（智见点评·行业研究报告）</text><text x="1224" y="700" font-size="20" text-anchor="end" fill="#6B6B6B" font-family="Georgia, Songti SC, STSong, serif" dominant-baseline="alphabetic">正式稿 · 2026-08</text></svg>