  作者: designer · 团队「HTML5演讲_我的暑假生活」（DeepSeek Harness Expert Library）
  日期: 2026-08-27
  版本: v2 · 插入 4 张实拍照片（航拍青岛海边→幕2 · 礁石海边时光→幕4 · 赶海收获→幕5 · 傍晚海景→幕6 柔光背景；base64 内嵌，单文件保持自包含）
  sha256(不含本注释行): 8d802a4f9379dfe80829b68708154b3868bef72a17329b7b0bd854d85964c882
  动效引擎: GSAP 3.12.5（CDN；gsap-timeline 无需单独引入——GSAP 3 的 Timeline 属于核心文件，
            已实测 https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap-timeline.min.js 为 404；
            CDN 加载失败自动降级为静态可读版，不会白屏）
  镜头方案: 依据 t1 设计简报（expert-tasks/t1/artifacts/设计简报_镜头方案.md）
  设计 tokens: 海蓝#14729E 阳光黄#F7B733 珊瑚#E86A5E 薄荷#4FB3A6 天蓝#8AC6E8 深navy#17324D 浅天蓝底#F0F7FA

-->
<style>
  :root{
    --sea:#14729E; --sun:#F7B733; --coral:#E86A5E; --mint:#4FB3A6;
    --sky:#8AC6E8; --navy:#17324D; --bg:#F0F7FA;
    --card:#FBFCF7; --sand:#F9E3B4; --sand2:#F0D192;
    --hair:rgba(23,50,77,.12); --shadow:rgba(23,50,77,.16);
    --ink:rgba(23,50,77,.88);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
    background:var(--bg); color:var(--navy);
    -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  }
  /* ============ 降级基线：无 JS / CDN 失败时，全部幕按静态可读文档堆叠 ============ */
  #stage{position:relative; width:100%;}
  .scene{
    position:relative; width:100%; min-height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* JS 就绪后切换为 16:9 全屏舞台：仅当前幕可见 */
  body.deck-ok{overflow:hidden;}
  body.deck-ok #stage{height:100vh;}
  body.deck-ok .scene{position:absolute; inset:0; height:100%; opacity:0; visibility:hidden; pointer-events:none;}
  body.deck-ok .scene.active{opacity:1; visibility:visible; pointer-events:auto;}
  body.rm .scene{transition:opacity .4s ease;}
  /* CDN 失败：隐藏导航家具，保留静态可读内容 */
  body.no-gsap .nav{display:none;}

  .board{position:absolute; inset:0; will-change:transform;}
  /* ---------- 通用文字 ---------- */
  .stitle{
    position:absolute; top:5%; left:50%; transform:translateX(-50%);
    font-size:clamp(44px,4.6vw,88px); font-weight:900; letter-spacing:.06em;
    color:var(--sea); text-shadow:0 3px 0 rgba(23,50,77,.08);
    white-space:nowrap; z-index:6;
  }
  /* ---------- 幕1 封面（crane-rise-reveal 适配·太阳升起揭示） ---------- */
  #s1{background:linear-gradient(180deg,#A9D7EE 0%,#F0F7FA 78%);}
  #s1 .cam{transform-origin:50% 42%;}
  #s1 .sun{position:absolute; left:14%; bottom:16%; width:clamp(150px,15vw,280px); z-index:2;}
  #s1 .cloud{position:absolute; width:clamp(120px,13vw,240px); z-index:1;}
  #s1 .cloud.c1{top:12%; left:8%;} #s1 .cloud.c2{top:20%; right:10%; width:clamp(90px,9vw,170px);}
  #s1 .gull{position:absolute; width:clamp(70px,7vw,130px); z-index:3;}
  #s1 .gull.g1{top:24%; left:44%;} #s1 .gull.g2{top:30%; left:58%; width:clamp(52px,5.2vw,96px);}
  #s1 .waveband{position:absolute; left:0; right:0; bottom:0; height:30%; z-index:4;}
  #s1 .titlewrap{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); text-align:center; z-index:5;}
  #s1 .bigtitle{
    font-size:clamp(64px,9vw,160px); font-weight:900; letter-spacing:.1em; color:var(--navy);
    text-shadow:0 6px 0 rgba(247,183,51,.55), 0 10px 22px var(--shadow); white-space:nowrap;
  }
  #s1 .title-pulse{
    position:absolute; inset:-6% -3%; color:rgba(23,50,77,.20); font-size:clamp(64px,9vw,160px);
    font-weight:900; letter-spacing:.1em; white-space:nowrap; opacity:0; pointer-events:none;
  }
  #s1 .subtitle{
    margin-top:1.2em; font-size:clamp(30px,2.9vw,56px); font-weight:700; color:var(--sea);
    letter-spacing:.18em;
  }
  /* ---------- 幕2 出发（depth-layer-moves 视差滑轨 + list-reveal 文案逐条） ---------- */
  #s2{background:linear-gradient(180deg,#A9D7EE 0%,#E7F3F9 55%,#F0F7FA 100%);}
  #s2 .layers{position:absolute; left:0; right:0; bottom:0; height:52%; z-index:2;}
  #s2 .wback{position:absolute; left:0; bottom:6%; width:112%; height:52%; filter:blur(2px) saturate(.92); opacity:.85;}
  #s2 .wmid{position:absolute; left:0; bottom:2%; width:122%; height:60%;}
  #s2 .wfront{position:absolute; left:0; bottom:0; width:132%; height:58%;}
  #s2 .wfront .frontitem{position:absolute; bottom:4%;}
  #s2 .wfront .crab{width:clamp(56px,5.4vw,104px);}
  #s2 .wfront .shell{width:clamp(40px,3.9vw,76px);}
  #s2 .wfront .star{width:clamp(34px,3.3vw,64px);}
  #s2 .sun2{position:absolute; right:9%; top:9%; width:clamp(90px,9vw,170px); z-index:1; opacity:.95;}
  #s2 .tickets{position:absolute; left:6%; bottom:14%; z-index:5; display:flex; flex-direction:column; gap:clamp(8px,.9vw,16px);}
  #s2 .ticket{
    background:var(--card); border:1px solid var(--hair); border-radius:20px;
    box-shadow:0 6px 18px var(--shadow);
    padding:clamp(8px,.9vw,16px) clamp(18px,1.8vw,34px);
    font-size:clamp(28px,2.6vw,48px); font-weight:800; color:var(--navy);
    width:fit-content; max-width:92vw; white-space:nowrap;
  }
  #s2 .ticket.last{border:2px solid var(--coral); background:#FEF6F0;}
  #s2 .ticket.last::before{content:""; display:inline-block; width:.55em; height:.55em; margin-right:.5em;
    border-radius:50%; background:var(--coral); vertical-align:middle;}
  /* ---------- 幕3 装备（spotlight-sweep 匀速扫光点名 + element-body-moves 弹跳立正） ---------- */
  #s3{background:linear-gradient(180deg,#BFE0F1 0%,#EAF5FA 52%,#F6E7C4 100%);}
  #s3 .sand3{position:absolute; left:0; right:0; bottom:0; height:34%; z-index:1;}
  #s3 .rocks3{position:absolute; left:4%; bottom:4%; width:clamp(120px,12vw,230px); z-index:2;}
  #s3 .rocks3.r2{left:auto; right:5%; bottom:5%; width:clamp(90px,9vw,170px);}
  #s3 .kit{
    position:absolute; width:15%; z-index:4; text-align:center; transform-origin:50% 100%;
  }
  #s3 .kit svg{width:clamp(64px,6.4vw,124px); height:auto; margin:0 auto; display:block; filter:drop-shadow(0 6px 10px var(--shadow));}
  #s3 .kit .klabel{
    display:inline-block; margin-top:.8em; background:var(--card); border:1px solid var(--hair);
    border-radius:999px; padding:.35em 1em; font-size:clamp(20px,1.7vw,32px); font-weight:800; color:var(--navy);
  }
  #s3 .beamwrap{position:absolute; inset:0; z-index:7; pointer-events:none; overflow:visible;}
  #s3 .beam{
    position:absolute; left:-20vw; top:0; width:60vw; height:100%;
    background:linear-gradient(100deg, rgba(247,183,51,0) 0%, rgba(247,183,51,.12) 34%, rgba(255,238,196,.30) 60%, rgba(247,183,51,0) 100%);
    clip-path:polygon(6% 0, 94% 0, 60% 100%, 0 100%);
  }
  #s3 .spot{
    position:absolute; left:14vw; top:30%; width:clamp(160px,17vw,320px); height:clamp(160px,17vw,320px);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,250,232,.95) 0%, rgba(247,183,51,.40) 46%, rgba(247,183,51,0) 72%);
  }
  #s3 .slogan{
    position:absolute; left:50%; bottom:12%; transform:translateX(-50%); z-index:8; white-space:nowrap;
    background:var(--card); border:1px solid var(--hair); border-radius:24px;
    box-shadow:0 10px 26px var(--shadow); padding:clamp(10px,1vw,18px) clamp(22px,2.2vw,42px);
    font-size:clamp(34px,3.3vw,64px); font-weight:900; color:var(--navy); letter-spacing:.06em;
  }
  #s3 .slogan .w{display:inline-block; will-change:transform,opacity;}
  /* ---------- 幕4 妙招（步骤卡逐张入场 + draw-svg-trace 箭头 + line-boil 呼吸） ---------- */
  #s4{background:linear-gradient(180deg,#D6ECF7 0%,#F0F7FA 100%);}
  #s4 .board4{transform-origin:50% 50%;}
  #s4 .step{
    position:absolute; width:18%; z-index:4;
    background:var(--card); border:1px solid var(--hair); border-radius:22px;
    box-shadow:0 10px 24px var(--shadow); padding:clamp(10px,1.1vw,20px);
  }
  #s4 .step .snum{
    display:inline-block; width:2em; height:2em; line-height:2em; text-align:center;
    border-radius:50%; background:var(--mint); color:#fff; font-size:clamp(20px,1.8vw,34px); font-weight:900;
  }
  #s4 .step .sname{margin-top:.5em; font-size:clamp(26px,2.4vw,44px); font-weight:900; color:var(--navy);}
  #s4 .step .sdesc{margin-top:.4em; font-size:clamp(17px,1.5vw,28px); font-weight:600; color:var(--ink); line-height:1.45;}
  #s4 .arrows{position:absolute; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; overflow:visible;}
  #s4 .arrows path{stroke:var(--sea); stroke-width:7; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  #s4 .arrows .head{fill:var(--sea); stroke:none;}
  #s4 .arrows .pen{fill:var(--coral); stroke:var(--navy); stroke-width:2;}
  /* ---------- 幕5 收获（crash-zoom 撞停点名 + counter 冲线纸屑 + 螃蟹堆 + 金句盖章） ---------- */
  #s5{background:linear-gradient(180deg,#BFE0F1 0%,#F0F7FA 60%,#FBEED0 100%);}
  #s5 .board5{transform-origin:50% 38%;}
  #s5 .btitle{
    position:absolute; top:6%; left:50%; transform:translateX(-50%);
    font-size:clamp(48px,5vw,96px); font-weight:900; letter-spacing:.12em; color:var(--sea);
    text-shadow:0 4px 0 rgba(23,50,77,.08); white-space:nowrap; z-index:6;
  }
  #s5 .nums{position:absolute; left:50%; top:32%; transform:translate(-50%,-50%); display:flex; align-items:flex-end; gap:clamp(16px,2.4vw,44px); z-index:6; white-space:nowrap;}
  #s5 .num{font-size:clamp(96px,11vw,200px); font-weight:900; color:var(--navy); letter-spacing:.02em; line-height:1;}
  #s5 .num .unit{font-size:.42em; color:var(--sea);}
  #s5 .pill{
    background:var(--card); border:1px solid var(--hair); border-radius:20px;
    box-shadow:0 8px 20px var(--shadow); padding:.5em 1em;
    font-size:clamp(30px,3vw,58px); font-weight:900; color:var(--coral); margin-bottom:.25em;
  }
  #s5 .pillrow{position:absolute; left:50%; top:46%; transform:translateX(-50%); display:flex; gap:clamp(14px,2vw,36px); z-index:6;}
  #s5 .crabs{position:absolute; left:0; right:0; bottom:2%; height:32%; z-index:5;}
  #s5 .crab{position:absolute; width:clamp(52px,5vw,96px); transform-origin:50% 80%;}
  #s5 .quote{
    position:absolute; left:50%; top:64%; transform:translateX(-50%); z-index:8; white-space:nowrap;
    background:var(--card); border:2px solid var(--coral); border-radius:26px;
    box-shadow:0 12px 30px var(--shadow); padding:clamp(12px,1.2vw,22px) clamp(24px,2.4vw,46px);
    font-size:clamp(34px,3.3vw,64px); font-weight:900; color:var(--navy); letter-spacing:.04em;
  }
  #s5 .quote .w{display:inline-block; will-change:transform,opacity;}
  #s5 .quote .hl{position:relative; color:var(--coral);}
  #s5 .markline{position:absolute; left:-.12em; right:-.12em; bottom:-.14em; height:.5em; pointer-events:none;}
  #s5 .confetti-box{position:absolute; inset:0; z-index:12; pointer-events:none; overflow:hidden;}
  #s5 .confetti-box .confetti{position:absolute; border-radius:2px; will-change:transform,opacity;}
  /* ---------- 幕6 结束（gradient-transition 渐变日落收束） ---------- */
  #s6 .sky{position:absolute; inset:0;}
  #s6 .sky1{background:linear-gradient(180deg,#8AC6E8 0%,#F0F7FA 78%);}
  #s6 .sky2{background:linear-gradient(180deg,#F7B733 0%,#E86A5E 45%,#8AC6E8 100%); opacity:0;}
  #s6 .sky3{background:linear-gradient(180deg,#2E4A66 0%,#17324D 78%); opacity:0;}
  #s6 .sunsink{
    position:absolute; left:52%; top:26%; width:clamp(120px,12vw,230px); z-index:2;
    filter:drop-shadow(0 0 34px rgba(247,183,51,.75));
  }
  #s6 .thanks{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); z-index:5; text-align:center;
  }
  #s6 .thanks .t1{
    font-size:clamp(64px,9vw,160px); font-weight:900; letter-spacing:.14em; color:#FDFBF4;
    text-shadow:0 6px 0 rgba(23,50,77,.35), 0 12px 30px rgba(23,50,77,.45);
  }
  #s6 .thanks .t2{
    margin-top:1.4em; font-size:clamp(26px,2.4vw,46px); font-weight:700; letter-spacing:.24em;
    color:#F7B733; text-shadow:0 3px 0 rgba(23,50,77,.3);
  }
  /* ---------- v2 实拍照片（剪贴簿风格 · 支撑元素不抢主角动效） ---------- */
  .photo-card{
    position:absolute; z-index:6;
    background:#FDFBF4; border:1px solid var(--hair); border-radius:12px;
    box-shadow:0 10px 26px var(--shadow);
    padding:clamp(6px,.6vw,12px) clamp(6px,.6vw,12px) clamp(4px,.5vw,10px);
    will-change:transform,opacity;
  }
  .photo-card img{display:block; width:100%; height:auto; border-radius:8px; object-fit:cover;}
  .photo-card .cap{
    margin-top:.45em; text-align:center;
    font-size:clamp(15px,1.25vw,24px); font-weight:800; color:var(--ink); letter-spacing:.12em;
  }
  .photo-card::before{ /* 胶带 */
    content:""; position:absolute; left:50%; top:clamp(-14px,-1.2vw,-8px);
    width:34%; height:clamp(18px,1.8vw,30px);
    transform:translateX(-50%) rotate(-4deg);
    background:rgba(247,183,51,.45); border:1px solid rgba(23,50,77,.10); border-radius:3px;
  }
  #s2 .photo-card{right:5.5%; top:17%; width:clamp(200px,21vw,400px); transform:rotate(2.5deg);}
  #s2 .photo-card img{aspect-ratio:16/10;}
  #s4 .photo-card{right:3.5%; top:9%; width:clamp(190px,17.5vw,330px); transform:rotate(-2deg);}
  #s4 .photo-card img{aspect-ratio:4/3;}
  #s5 .photo-card{left:4.5%; top:15%; width:clamp(190px,17.5vw,330px); transform:rotate(-2.5deg);}
  #s5 .photo-card img{aspect-ratio:4/3;}
  .sea-photo{position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; z-index:1;}
  /* ---------- 导航家具 ---------- */
  .nav{position:absolute; inset:0; z-index:40; pointer-events:none;}
  .nav button{pointer-events:auto; border:none; cursor:pointer; font-family:inherit;}
  .nav .nprev,.nav .nnext{
    position:absolute; top:50%; transform:translateY(-50%);
    width:clamp(48px,4.4vw,76px); height:clamp(48px,4.4vw,76px); border-radius:50%;
    background:rgba(23,50,77,.08); color:var(--navy);
    font-size:clamp(24px,2.2vw,40px); font-weight:900; line-height:1;
    box-shadow:0 4px 12px rgba(23,50,77,.10); transition:background .2s;
  }
  .nav .nprev:hover,.nav .nnext:hover{background:rgba(23,50,77,.18);}
  .nav .nprev{left:clamp(8px,1.2vw,22px);} .nav .nnext{right:clamp(8px,1.2vw,22px);}
  .nav .dots{
    position:absolute; left:50%; bottom:clamp(12px,2vh,26px); transform:translateX(-50%);
    display:flex; gap:clamp(8px,.9vw,14px);
  }
  .nav .dot{
    width:clamp(10px,.9vw,15px); height:clamp(10px,.9vw,15px); border-radius:50%;
    background:rgba(23,50,77,.30); transition:background .25s, transform .25s; padding:0;
  }
  .nav .dot.on{background:var(--sea); transform:scale(1.35);}
  @media (prefers-reduced-motion: reduce){
    .nav .nprev,.nav .nnext{transition:none;}
  }
</style>
</head>
<body>
<div id="stage">

  <!-- ══════════ 幕1 封面 ══════════ 镜头：crane-rise-reveal（升降臂拉升揭示·太阳升起） -->
  <section class="scene" id="s1" aria-label="封面">
    <div class="board cam">
      <svg class="sun" viewBox="0 0 220 220" aria-hidden="true">
        <g stroke="#17324D" stroke-width="8" stroke-linecap="round">
          <circle cx="110" cy="110" r="62" fill="#F7B733"/>
          <path d="M110 6 V30 M110 190 V214 M6 110 H30 M190 110 H214 M59 59 L74 74 M146 146 L161 161 M161 59 L146 74 M74 146 L59 161" stroke-width="11"/>
        </g>
      </svg>
      <svg class="cloud c1" viewBox="0 0 200 90" aria-hidden="true">
        <g fill="#FDFBF4" stroke="#17324D" stroke-width="6" stroke-linejoin="round">
          <ellipse cx="70" cy="55" rx="46" ry="26"/>
          <ellipse cx="115" cy="45" rx="40" ry="30"/>
          <ellipse cx="150" cy="58" rx="34" ry="20"/>
          <rect x="48" y="52" width="118" height="18" rx="9"/>
        </g>
      </svg>
      <svg class="cloud c2" viewBox="0 0 200 90" aria-hidden="true">
        <g fill="#FDFBF4" stroke="#17324D" stroke-width="6" stroke-linejoin="round">
          <ellipse cx="70" cy="55" rx="46" ry="26"/>
          <ellipse cx="115" cy="45" rx="40" ry="30"/>
          <ellipse cx="150" cy="58" rx="34" ry="20"/>
          <rect x="48" y="52" width="118" height="18" rx="9"/>
        </g>
      </svg>
      <svg class="gull g1" viewBox="0 0 90 50" aria-hidden="true">
        <path d="M6 34 Q30 6 44 24 Q58 6 84 34" fill="none" stroke="#17324D" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <svg class="gull g2" viewBox="0 0 90 50" aria-hidden="true">
        <path d="M6 34 Q30 6 44 24 Q58 6 84 34" fill="none" stroke="#17324D" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div class="waveband">
        <svg viewBox="0 0 1200 300" preserveAspectRatio="none" style="width:100%;height:100%" aria-hidden="true">
          <path d="M0 130 Q80 90 160 130 T320 130 T480 130 T640 130 T800 130 T960 130 T1120 130 T1280 130 V300 H0 Z" fill="#8AC6E8" opacity=".8"/>
          <path d="M0 190 Q80 150 160 190 T320 190 T480 190 T640 190 T800 190 T960 190 T1120 190 T1280 190 V300 H0 Z" fill="#4FB3A6" opacity=".62"/>
          <path d="M0 250 Q80 220 160 250 T320 250 T480 250 T640 250 T800 250 T960 250 T1120 250 T1280 250 V300 H0 Z" fill="#14729E" opacity=".45"/>
        </svg>
      </div>
      <div class="titlewrap">
        <div style="position:relative; display:inline-block;">
          <span class="bigtitle">我的暑假生活</span>
          <span class="title-pulse" aria-hidden="true">我的暑假生活</span>
        </div>
        <div class="subtitle">演讲者：英弘毅 · 三年级</div>
      </div>
    </div>
  </section>

  <!-- ══════════ 幕2 出发 ══════════ 镜头：depth-layer-moves（三层视差滑轨）+ list-reveal（文案逐条） -->
  <section class="scene" id="s2" aria-label="出发">
    <div class="board">
      <svg class="sun2" viewBox="0 0 220 220" aria-hidden="true">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
        onerror="document.body.classList.add('no-gsap')"></script>
<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (typeof window.gsap === 'undefined') { document.body.classList.add('no-gsap'); return; }
  var gsap = window.gsap;
  document.body.classList.add('deck-ok');
  if (reduce) document.body.classList.add('rm');

  function $(s, c){ return (c||document).querySelector(s); }
  function $a(s, c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); }

  var scenes = $a('.scene');
  var cur = 0;

  /* ---- 进度点 ---- */
  var dotsWrap = $('#dots');
  var dots = scenes.map(function(sc, i){
    var d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('aria-label', '第' + (i+1) + '幕');
    d.addEventListener('click', function(ev){ ev.stopPropagation(); goTo(i); });
    dotsWrap.appendChild(d);
    return d;
  });

  /* ---- 每幕时间线（paused，进场时 restart） ---- */
  var tls = scenes.map(function(){ return gsap.timeline({ paused:true }); });
  var T = gsap.timeline; /* 便于后续引用 */

  /* 幕1 封面：crane-rise-reveal（相机 3.2× 特写→减速升起，太阳/云/海鸥/海浪逐层涌入，标题落定脉冲+副题浮现） */
  (function(){
    var tl = tls[0];
    tl.addLabel('start', 0);
    tl.fromTo('#s1 .cam', { scale:3.2 }, { scale:1, duration:3.4, ease:'power2.out' }, 0)
      .fromTo('#s1 .sun',  { y:190 }, { y:0, duration:3.0, ease:'power2.out' }, 0.25)
      .fromTo('#s1 .cloud',{ x:-150, autoAlpha:0 }, { x:0, autoAlpha:1, duration:1.7, ease:'power1.out', stagger:0.4 }, 1.1)
      .fromTo('#s1 .gull', { x:130, autoAlpha:0 }, { x:0, autoAlpha:1, duration:1.4, ease:'power1.out', stagger:0.35 }, 1.5)
      .fromTo('#s1 .waveband', { y:90, autoAlpha:0 }, { y:0, autoAlpha:1, duration:1.5, ease:'power2.out' }, 1.8)
      .fromTo('#s1 .subtitle', { y:26, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.9, ease:'power2.out' }, 3.5)
      .fromTo('#s1 .title-pulse', { opacity:0.22 }, { opacity:0, duration:0.8, ease:'power1.out' }, 3.45);
    /* 标题收正后 hold ≥1.5s（R1），总时长 ≈10s */
    tl.to({}, { duration:5.0 }, 4.3);
  })();

  /* 幕2 出发：depth-layer-moves（三层视差：0.35/0.7/1.4 速度梯度，blur/降饱和锚定）+ list-reveal（文案逐条浮入） */
  (function(){
    var tl = tls[1];
    tl.fromTo('#s2 .wback',  { xPercent:0 }, { xPercent:-4,  duration:10, ease:'none' }, 0)
      .fromTo('#s2 .wmid',   { xPercent:0 }, { xPercent:-9,  duration:10, ease:'none' }, 0)
      .fromTo('#s2 .wfront', { xPercent:0 }, { xPercent:-18, duration:10, ease:'none' }, 0)
      .fromTo('#s2 .ticket',
        { scale:0.78, y:14, autoAlpha:0 },
        { scale:1, y:0, autoAlpha:1, duration:0.7, ease:'back.out(1.6)', stagger:0.8 }, 1.0)
      .fromTo('#s2 .photo-card', { y:44, rotation:6, autoAlpha:0 }, { y:0, rotation:2.5, autoAlpha:1, duration:0.7, ease:'back.out(1.4)' }, 4.6) /* 实拍照片压轴入位 */
      .to({}, { duration:3.0 }, 6.0); /* 末行钩子落定后 hold（R1） */
  })();

  /* 幕3 装备：spotlight-sweep A 式（光束 strict linear 匀速扫过，光到即弹起=同一因果链）+ element-body-moves A（拉伸+落点回弹） */
  (function(){
    var tl = tls[2];
    var kits = $a('#s3 .kit');
    var popAt = [1.55, 2.09, 2.63, 3.17, 3.71]; /* 与光束到达各件装备的 x 位置同步（匀速推算） */
    tl.fromTo('#s3 .beamwrap', { xPercent:-60, autoAlpha:1 }, { xPercent:185, duration:3.8, ease:'none' }, 0.8)
      .to('#s3 .beamwrap', { autoAlpha:0, duration:0.6, ease:'none' }, 4.4);
    kits.forEach(function(el, i){
      /* 注意：autoAlpha 必须同时写进 to（只写在 from 时 GSAP 3.12.5 会算出 0→0 的 no-op，实测踩坑） */
      tl.fromTo(el,
        { y:175, scaleY:2.1, scaleX:0.55, autoAlpha:0 },
        { y:0, scaleY:1, scaleX:1, autoAlpha:1, duration:0.5, ease:'power2.out' }, popAt[i])
        .to(el, { scaleX:1.12, scaleY:0.86, duration:0.08, ease:'none' }, popAt[i]+0.5)
        .to(el, { scaleX:1, scaleY:1, duration:0.30, ease:'back.out(2)' }, popAt[i]+0.58);
    });
    tl.fromTo('#s3 .slogan .w',
      { scale:1.28, autoAlpha:0 },
      { scale:1, autoAlpha:1, duration:0.5, ease:'power2.out', stagger:0.12 }, 5.3)
      .to({}, { duration:1.8 }, 6.2); /* 横幅落定 hold ≥1s */
  })();

  /* 幕4 妙招：主=步骤卡逐张入场 + 笔头描线画箭头 → line-boil；底=相机单向慢推 */
  (function(){
    var tl = tls[3];
    /* 底运动：相机单向慢推（0.86→1.0，收尾落在完整可读的终态构图——R1 与静止版一致；
       不用 1→1.3 是为了避免落定后边缘元素被推出画外） */
    tl.fromTo('#s4 .board4', { scale:0.86 }, { scale:1, duration:15, ease:'none' }, 0)
      .fromTo('#s4 .step',
        { scale:0.78, autoAlpha:0 },
        { scale:1, autoAlpha:1, duration:0.6, ease:'back.out(1.7)', stagger:0.9 }, 0.8)
      .add(function(){ drawArrows(); }, 4.8)
      .add(function(){ startBoil(); }, 7.4)
      .fromTo('#s4 .photo-card', { y:36, rotation:-6, autoAlpha:0 }, { y:0, rotation:-2, autoAlpha:1, duration:0.7, ease:'back.out(1.4)' }, 8.2) /* 实拍照片入位 */
      .to({}, { duration:4.0 }, 11.0); /* 末卡落定 + 沸腾呼吸 hold */
  })();

  /* 幕5 收获：crash-zoom-punch（撞停急推点名）+ counter-confetti（计数冲线+纸屑抢拍）+ 螃蟹堆 + 金句压印+马克笔划线 */
  (function(){
    var tl = tls[4];
    var numEl = $('#cnt');
    tl.fromTo('#s5 .btitle', { scale:1.25, autoAlpha:0 }, { scale:1, autoAlpha:1, duration:0.6, ease:'back.out(1.6)' }, 0.3)
      .to('#s5 .board5', { scale:2.6, duration:0.2, ease:'power2.in' }, 1.6)
      .to('#s5 .board5', { keyframes:[{x:14},{x:-8},{x:5},{x:-3},{x:1.5},{x:0}], duration:0.32, ease:'none' }, 1.8)
      .add(function(){ countNum(); }, 1.72)
      .add(function(){ burstConfetti(); }, 2.84) /* 纸屑抢拍：计数到位(2.92)前约 0.08s */
      .to(numEl, { scale:1.16, duration:0.12, ease:'none' }, 2.92)
      .to(numEl, { scale:1, duration:0.22, ease:'back.out(2)' }, 3.04)
      .fromTo('#s5 .pill',
        { scale:0.7, autoAlpha:0 },
        { scale:1, autoAlpha:1, duration:0.45, ease:'back.out(1.8)', stagger:0.4 }, 3.6)
      .to('#s5 .board5', { scale:1, x:0, duration:0.7, ease:'power2.inOut' }, 4.7)
      .fromTo('#s5 .crab',
        { x:function(i){ return i%2 ? 460 : -460; }, y:150, rotation:function(i){ return i%2 ? 46 : -46; }, autoAlpha:0 },
        { x:0, y:0, rotation:0, autoAlpha:1, duration:0.55, ease:'bounce.out',
          stagger:{ each:[0.45,0.33,0.27,0.23,0.20,0.17,0.15], from:0 } }, 4.95) /* 越来越快，落定 0.5s 停 */
      .fromTo('#s5 .quote .w',
        { scale:1.28, autoAlpha:0 },
        { scale:1, autoAlpha:1, duration:0.5, ease:'power2.out', stagger:0.1 }, 6.9)
      .fromTo('#s5 .markpath', { strokeDashoffset:1 }, { strokeDashoffset:0, duration:0.28, ease:'power1.inOut' }, 7.8)
      .fromTo('#s5 .photo-card', { y:32, rotation:4, autoAlpha:0 }, { y:0, rotation:-2.5, autoAlpha:1, duration:0.6, ease:'back.out(1.5)' }, 5.8) /* 实拍照片入位（急推归位后） */
      .to({}, { duration:2.6 }, 8.4); /* 金句 hold ≥1.5s */
  })();

  /* 幕6 结束：gradient-transition（天空渐变：天蓝→橙粉→深蓝）+ 太阳匀速下沉 + 谢谢大家浮现 */
  (function(){
    var tl = tls[5];
    tl.fromTo('#s6 .sky1', { autoAlpha:1 }, { autoAlpha:0.15, duration:4.0, ease:'none' }, 0.2)
      .fromTo('#s6 .sky2', { autoAlpha:0 }, { autoAlpha:1, duration:1.6, ease:'none' }, 0.8)
      .fromTo('#s6 .sky3', { autoAlpha:0 }, { autoAlpha:1, duration:2.2, ease:'none' }, 2.2)
      .fromTo('#s6 .sunsink', { x:'5vw', y:'0vh', scale:1 }, { x:'-8vw', y:'16vh', scale:0.85, duration:3.8, ease:'none' }, 0.3)
      .fromTo('#s6 .thanks .t1', { scale:0.9, autoAlpha:0 }, { scale:1, autoAlpha:1, duration:0.9, ease:'power2.out' }, 1.9)
      .fromTo('#s6 .thanks .t2', { y:20, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.8, ease:'power2.out' }, 2.6)
      .fromTo('#s6 .sea-photo', { autoAlpha:0 }, { autoAlpha:0.32, duration:1.8, ease:'none' }, 0.5) /* 实拍海景柔光垫底 */
      .to({}, { duration:1.6 }, 3.4); /* 收尾静止 ≥1.5s（R1 全片记忆点） */
  })();

  /* ---- 幕4：笔头描线（draw-svg-trace：pathLength=1 + dashoffset，笔头沿路径跑） ---- */
  var pen = null, arrowJobs = [], boilTurb = null, boilRafId = 0;
  function drawArrows(){
    if (reduce) return;
    var svg = $('#s4 .arrows');
    var lines = $a('.arrowline', svg);
    var heads = $a('.head', svg);
    pen = $('.pen', svg);
    lines.forEach(function(path, i){
      var L = path.getTotalLength();
      var job = {
        path: path,
        tween: gsap.fromTo(path, { strokeDashoffset:1 }, {
          strokeDashoffset:0, duration:0.8, ease:'power2.inOut', delay:i*0.5,
          onUpdate: function(){
            var p = this.progress(); /* 用 tween 自身进度（GSAP 写 style 不写属性，不能读 attribute） */
            var pt = job.path.getPointAtLength(Math.max(0.001, Math.min(0.999, p)) * L);
            if (pen){ pen.setAttribute('cx', pt.x); pen.setAttribute('cy', pt.y); pen.setAttribute('opacity', 1); }
          },
          onComplete: function(){
            gsap.to(heads[i], { autoAlpha:1, duration:0.15 });
            if (i === lines.length - 1){ gsap.to(pen, { opacity:0, duration:0.4, delay:0.5 }); }
          }
        })
      };
      arrowJobs.push(job);
    });
    gsap.set(heads, { autoAlpha:0 });
  }
  /* ---- 幕4：line-boil（feTurbulence seed 每 3 帧跳变；沸腾段外不渲染 filter） ---- */
  function startBoil(){
    if (reduce) return;
    var svg = $('#s4 .arrows');
    var filter = $('#boil', svg);
    var turb = $('#boilTurb', svg);
    if (!filter || !turb) return;
    var lines = $a('.arrowline', svg);
    lines.forEach(function(l){ l.setAttribute('filter', 'url(#boil)'); });
    var frame = 0;
    function step(){
      frame++;
      if (frame % 3 === 0) turb.setAttribute('seed', 1 + Math.floor(frame/3));
      boilRafId = requestAnimationFrame(step);
    }
    boilTurb = turb;
    boilRafId = requestAnimationFrame(step);
  }
  function stopBoil(){
    if (boilRafId){ cancelAnimationFrame(boilRafId); boilRafId = 0; }
    var svg = $('#s4 .arrows');
    if (svg){ $a('.arrowline', svg).forEach(function(l){ l.removeAttribute('filter'); }); }
  }

  /* ---- 幕5：计数冲线（easeOutQuart 冲刺） ---- */
  function countNum(){
    if (reduce){ $('#cnt').textContent = '100'; return; }
    var o = { v:0 };
    gsap.to(o, { v:100, duration:1.2, ease:'power4.out', onUpdate:function(){
      $('#cnt').textContent = Math.round(o.v);
    }});
  }
  /* ---- 幕5：纸屑抢拍（确定性种子 mulberry32，闭式弹道） ---- */
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function burstConfetti(){
    if (reduce) return;
    var box = $('#s5 .confetti-box');
    var rnd = mulberry32(20260827);
    var colors = ['#F7B733','#E86A5E','#4FB3A6','#8AC6E8','#14729E','#F9E3B4'];
    var W = window.innerWidth, H = window.innerHeight;
    var pieces = [];
    for (var i=0;i<52;i++){
      var d = document.createElement('div');
      d.className = 'confetti';
      var size = 8 + rnd()*8;
      d.style.width = size + 'px'; d.style.height = (size*0.62) + 'px';
      d.style.background = colors[i % colors.length];
      var side = (i%2) ? 1 : -1;
      var x0 = side>0 ? -40 : W+40;
      var y0 = H*0.30 + rnd()*H*0.12;
      d.style.left = x0 + 'px'; d.style.top = y0 + 'px';
      box.appendChild(d);
      pieces.push({
        el:d, x:x0, y:y0,
        vx:-side*(150+rnd()*320), vy:-(230+rnd()*220),
        g:900+rnd()*520, rot:rnd()*360, rs:(rnd()*10-5)*2.2,
        age:0, life:1.8
      });
    }
    var fn = function(){
      var alive = false;
      for (var i=pieces.length-1;i>=0;i--){
        var p = pieces[i];
        p.age += 1/60;
        if (p.age >= p.life){ p.el.parentNode.removeChild(p.el); pieces.splice(i,1); continue; }
        p.vy += p.g/60; p.x += p.vx/60; p.y += p.vy/60; p.rot += p.rs/60;
        p.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px) rotate(' + p.rot + 'deg)';
        p.el.style.opacity = p.age > p.life-0.5 ? (p.life-p.age)/0.5 : 1;
        alive = true;
      }
      if (!alive) gsap.ticker.remove(fn);
    };
    gsap.ticker.add(fn);
  }

  /* ---- 翻幕 ---- */
  function show(i){
    scenes.forEach(function(sc, j){
      if (reduce){ sc.classList.toggle('active', j===i); }
      else { gsap.set(sc, { autoAlpha: j===i ? 1 : 0 }); }
    });
    dots.forEach(function(d, j){ d.classList.toggle('on', j===i); });
  }
  function goTo(i){
    if (i<0 || i>=scenes.length || i===cur) return;
    if (cur === 3) stopBoil();
    cur = i;
    show(cur);
    if (!reduce) tls[cur].restart();
  }
  function next(){ goTo(cur+1); }
  function prev(){ goTo(cur-1); }

  /* ---- 事件：键盘 / 箭头按钮 / 点击舞台 ---- */
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'PageDown' || ev.key === 'Enter'){ ev.preventDefault(); next(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp'){ ev.preventDefault(); prev(); }
  });
  $('.nnext').addEventListener('click', function(ev){ ev.stopPropagation(); next(); });
  $('.nprev').addEventListener('click', function(ev){ ev.stopPropagation(); prev(); });
  $('#stage').addEventListener('click', function(ev){
    if (ev.target.closest('.nav')) return;
    next();
  });
  window.addEventListener('keydown', function(ev){ if (ev.key === 'Home') goTo(0); if (ev.key === 'End') goTo(5); });

  /* v2：reduced-motion 下整卷跳到各幕终态构图（设计规格「静止版」的落实，
     同时规避 GSAP fromTo immediateRender 把元素藏在 opacity:0 的问题） */
  if (reduce){
    tls.forEach(function(t){ t.progress(1, true); });
    $a('#s4 .arrowline').forEach(function(l){ l.style.strokeDashoffset = '0'; });
    gsap.set('#s5 .markpath', { strokeDashoffset:0 });
    $a('.photo-card').forEach(function(el){ gsap.set(el, { autoAlpha:1 }); });
    var sp = $('#s6 .sea-photo'); if (sp){ gsap.set(sp, { autoAlpha:0.32 }); }
  }

  /* ---- 启动 ---- */
  try {
    show(0);
    if (!reduce) tls[0].restart();
  } catch (err) {
    /* 任何异常都不允许白屏：回退到静态可读版 */
    document.body.classList.remove('deck-ok', 'rm');
    document.body.classList.add('no-gsap');
  }
})();
</script>
</body>
</html>
